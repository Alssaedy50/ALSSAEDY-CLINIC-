plugins { id 'com.android.application' }

def webOutput = layout.buildDirectory.dir("generated/web-assets")
def resOutput = layout.buildDirectory.dir("generated/android-res")

tasks.register("prepareWebAssets", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "manifest.webmanifest"
        include "sw.js"
        include "logo.png"
        include "android-app-bridge.js"
        include "css/**"
        include "js/**"
        include "assets/**"
        include "vendor/**"
    }
    into(webOutput.map { it.dir("web") })
}

tasks.register("prepareAndroidResources", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "logo.png"
    }
    into(resOutput.map { it.dir("drawable") })
    rename { "clinic_logo.png" }
}

tasks.named("preBuild").configure {
    dependsOn("prepareWebAssets", "prepareAndroidResources")
}

android {
    def releaseKeystore = System.getenv("ALSSAEDY_RELEASE_KEYSTORE")
    def releaseStorePassword = System.getenv("ALSSAEDY_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("ALSSAEDY_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("ALSSAEDY_RELEASE_KEY_PASSWORD")

    signingConfigs {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    namespace "com.alssaedy.clinic"
    compileSdk 35

    defaultConfig {
        applicationId "com.alssaedy.clinic"
        minSdk 29
        targetSdk 35
        versionCode 16
        versionName "1.2.0"
    }

    sourceSets {
        main {
            assets.srcDir(webOutput)
            res.srcDir(resOutput)
        }
    }

    buildTypes {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

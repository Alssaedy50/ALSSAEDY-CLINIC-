name: Build ALSSAEDY Clinic Android APK

on:
  push:
    branches:
      - main
      - android-app-full-20261007
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate production signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ALSSAEDY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ALSSAEDY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALSSAEDY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALSSAEDY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ALSSAEDY_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ALSSAEDY_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ALSSAEDY_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ALSSAEDY_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Prepare production signing
        env:
          KEYSTORE_B64: ${{ secrets.ALSSAEDY_RELEASE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/alssaedy-release.keystore
          test -s app/alssaedy-release.keystore

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build signed production APK
        env:
          ALSSAEDY_RELEASE_KEYSTORE: ${{ github.workspace }}/android-app/app/alssaedy-release.keystore
          ALSSAEDY_RELEASE_STORE_PASSWORD: ${{ secrets.ALSSAEDY_RELEASE_STORE_PASSWORD }}
          ALSSAEDY_RELEASE_KEY_ALIAS: ${{ secrets.ALSSAEDY_RELEASE_KEY_ALIAS }}
          ALSSAEDY_RELEASE_KEY_PASSWORD: ${{ secrets.ALSSAEDY_RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify production APK signature
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify APK metadata
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk | grep -E "package: name='com.alssaedy.clinic'|versionCode='18'|versionName='1.3.0'"

      - name: Generate SHA256 checksum
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/ALSSAEDY-CLINIC-v1.3.0-release-SIGNED.apk.sha256
          cat app/build/outputs/apk/release/ALSSAEDY-CLINIC-v1.3.0-release-SIGNED.apk.sha256

      - name: Remove temporary signing key
        if: always()
        run: rm -f app/alssaedy-release.keystore

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSSAEDY-CLINIC-v1.3.0-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: ALSSAEDY-CLINIC-v1.3.0-release-SHA256
          path: android-app/app/build/outputs/apk/release/ALSSAEDY-CLINIC-v1.3.0-release-SIGNED.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed production APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSSAEDY-CLINIC-v1.3.0-release-SIGNED
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then RELEASE_TAG="$GITHUB_REF_NAME"; fi
          if [[ "$RELEASE_TAG" != v* ]]; then RELEASE_TAG="v1.3.0"; fi
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          SHA="android-app/app/build/outputs/apk/release/ALSSAEDY-CLINIC-v1.3.0-release-SIGNED.apk.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" "$SHA" \
              --title "ALSSAEDY CLINIC $RELEASE_TAG" \
              --notes-file docs/releases/v1.3.0.md \
              --target "$GITHUB_SHA"
          fi

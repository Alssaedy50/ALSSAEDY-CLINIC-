name: Build ALSSAEDY Clinic Android APK

on:
  push:
    branches:
      - main
      - android-app-full-20261007
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSSAEDY-CLINIC-v1.0.4-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK build output
        uses: actions/upload-artifact@v4
        with:
          name: ALSSAEDY-CLINIC-v1.0.4-release-unsigned
          path: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 90

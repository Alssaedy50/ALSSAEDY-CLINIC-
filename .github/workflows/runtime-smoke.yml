name: AQSA7 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax validation
        run: |
          for file in js/*.js; do node --check "$file"; done

      - name: Verify AI vendor isolation in business/platform modules
        run: |
          if grep -Eri -- 'openai|anthropic|google-generative-ai|google/genai|mistralai|cohere|groq' js/product.js js/capabilities.js js/repository.js js/storage.js js/app.js; then
            echo 'Direct AI vendor/SDK reference leaked into core or business modules.'
            exit 1
          fi

      - name: Verify Android and service-worker security boundaries
        run: |
          grep -q 'android:allowBackup="false"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="@xml/backup_rules"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'setAllowFileAccessFromFileURLs(false)' android-app/app/src/main/java/com/alssaedy/clinic/MainActivity.java
          grep -q 'setAllowUniversalAccessFromFileURLs(false)' android-app/app/src/main/java/com/alssaedy/clinic/MainActivity.java
          grep -q "const CACHE_NAME = 'alssaedy-clinic-v1.2.7-core'" sw.js
          grep -q './js/google-drive-provider.js?v=1.0.0' sw.js
          grep -q './js/cloud-recovery.js?v=1.0.0' sw.js

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aqsa7-http.log 2>&1 &
          echo $! >/tmp/aqsa7-http.pid
          sleep 2

      - name: Run mobile browser smoke
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

          const title = await page.title();
          if (!title.includes('سند قبض مالي')) throw new Error('Unexpected page title');

          // AQSA7 Phase 7.2: platform is the entry shell; enter the configured
          // Dental product before asserting product-local controls.
          if (!(await page.locator('#platformHome').isVisible())) throw new Error('AQSA7 platform home is not the default entry surface');
          await page.locator('#tabPlatformProducts').click();
          if (!(await page.locator('#platformProducts').isVisible())) throw new Error('AQSA7 Products/Projects surface did not open');
          if (!(await page.locator('#dentalProductCard').isVisible())) throw new Error('Configured Dental product card is missing');
          await page.locator('#dentalProductCard .platform-primary-btn').click();
          if (!(await page.locator('#productWorkspace').isVisible())) throw new Error('Dental product workspace did not open');
          if (!(await page.locator('#aqsa7ProductContext').isVisible())) throw new Error('Dental product context bar is missing');
          if (await page.locator('#platformHome').isVisible()) throw new Error('Platform home remained visible inside product context');

          // AQSA7 Phase 7.3: platform/workspace UX composition and traceability.
          const platformUx = await page.evaluate(() => {
            const visible = selector => {
              const el = document.querySelector(selector);
              return !!el && !el.hidden && getComputedStyle(el).display !== 'none';
            };
            const traceable = [...document.querySelectorAll('[data-ui-id]')]
              .filter(el => visible('#productWorkspace') || !el.closest('#productWorkspace'));
            return {
              workspaceHead: visible('#productWorkspaceHead'),
              workspaceTitle: document.querySelector('#productWorkspaceTitle')?.textContent?.trim() || '',
              platformTabsHidden: document.querySelector('.platform-tabs')?.hidden === true,
              modeControlsVisible: visible('#dentalModeControls'),
              dashboardVisible: visible('#clinicDashboard'),
              dashboardStatsPresent: Boolean(document.querySelector('#dashboardPatientsCount') && document.querySelector('#dashboardReceiptsToday') && document.querySelector('#dashboardPaidToday') && document.querySelector('#dashboardBalanceToday')),
              clinicLocalNavVisible: visible('#dentalProductTabs'),
              clinicLocalNavInsideContext: !!document.querySelector('#aqsa7ProductContext #dentalProductTabs'),
              globalDentalNavCount: document.querySelectorAll('body > header #dentalProductTabs').length,
              workflowToolInsideWorkspace: !!document.querySelector('#productWorkspace #dentalModeControls'),
              productContext: document.querySelector('#aqsa7ProductContext')?.textContent || '',
              traceableCount: traceable.length,
              traceableMissingOwner: traceable.filter(el => !el.dataset.owner || !el.dataset.action).map(el => el.id || el.dataset.uiId)
            };
          });
          if (!platformUx.workspaceHead || !/ALSSAEDY CLINIC/.test(platformUx.workspaceTitle)) throw new Error('Dental workspace header is missing or incoherent');
          if (!platformUx.platformTabsHidden || (!platformUx.modeControlsVisible && !platformUx.dashboardVisible) || !platformUx.clinicLocalNavVisible) throw new Error('Platform/product navigation layers are not mutually exclusive');
          if (!platformUx.clinicLocalNavInsideContext || platformUx.globalDentalNavCount !== 0 || !platformUx.workflowToolInsideWorkspace) throw new Error('Clinic-local navigation or receipt workflow controls are outside their product/workflow boundary');
          if (!platformUx.dashboardVisible || !platformUx.dashboardStatsPresent) throw new Error('Clinic dashboard surface or operational summary stats are missing');
          if (!/Dental Clinic/.test(platformUx.productContext) || !/ALSSAEDY CLINIC/.test(platformUx.productContext)) throw new Error('Product context does not identify product and instance');
          if (platformUx.traceableMissingOwner.length) throw new Error('Visible platform/product action is missing traceability metadata: '+JSON.stringify(platformUx.traceableMissingOwner));
          if (platformUx.traceableCount < 8) throw new Error('Insufficient platform/product UI traceability coverage: '+platformUx.traceableCount);

          const designTokens = await page.evaluate(() => {
            const root = getComputedStyle(document.documentElement);
            const token = name => root.getPropertyValue(name).trim();
            const tab = document.querySelector('#tabReceipt');
            return {
              primary: token('--color-primary'),
              paid: token('--color-paid'),
              warning: token('--color-warning'),
              surface: token('--color-surface'),
              white: token('--color-white'),
              border: token('--color-border'),
              fontUi: token('--font-ui'),
              touchTarget: token('--touch-target'),
              tabHeight: tab ? Math.round(tab.getBoundingClientRect().height) : 0
            };
          });
          const expectedTokens = {
            primary: '#1E3A8A',
            paid: '#059669',
            warning: '#D97706',
            surface: '#F8FAFC',
            white: '#FFFFFF',
            border: '#E2E8F0',
            touchTarget: '44px'
          };
          for (const [key, expected] of Object.entries(expectedTokens)) {
            const actual = designTokens[key].toUpperCase();
            if (actual !== expected.toUpperCase()) throw new Error('Design token mismatch '+key+': '+designTokens[key]);
          }
          if (!designTokens.fontUi.includes('system-ui')) throw new Error('UI font token is not system-ui based');
          if (designTokens.tabHeight < 44) throw new Error('Receipt tab touch target is below 44px: '+designTokens.tabHeight);

          const productBoundary = await page.evaluate(() => ({
            manifest: window.AQSA7_PRODUCT_MANIFEST,
            clinic: window.AQSA7_CLINIC_CONFIG,
            stamped: typeof window.aqsa7StampRecord === 'function' ? window.aqsa7StampRecord({id:'smoke-record'}) : null
          }));
          if (!productBoundary.manifest || productBoundary.manifest.productId !== 'dental-clinic') throw new Error('Product manifest boundary missing');
          if (!productBoundary.manifest.capabilities.includes('patients') || !productBoundary.manifest.capabilities.includes('receipts')) throw new Error('Dental product capability manifest incomplete');
          if (!productBoundary.manifest.optionalCapabilities.includes('ai')) throw new Error('AI capability boundary missing');
          if (!productBoundary.clinic || productBoundary.clinic.productId !== 'dental-clinic' || !productBoundary.clinic.tenantId || !productBoundary.clinic.instanceId) throw new Error('Clinic instance configuration boundary missing');
          if (productBoundary.stamped.productId !== 'dental-clinic' || productBoundary.stamped.tenantId !== productBoundary.clinic.tenantId || productBoundary.stamped.instanceId !== productBoundary.clinic.instanceId) throw new Error('Repository record identity stamping failed');
          const productContract = await page.evaluate(() => ({
            validation: typeof window.aqsa7ValidateProductDefinition === 'function' ? window.aqsa7ValidateProductDefinition() : null,
            modules: window.AQSA7_PRODUCT_MANIFEST?.modules || [],
            enabledModules: window.AQSA7_CLINIC_CONFIG?.enabledModules || [],
            defaultReceiptSize: window.AQSA7_CLINIC_CONFIG?.documentTemplates?.receipt?.defaultSize,
            allowedReceiptSizes: window.AQSA7_CLINIC_CONFIG?.documentTemplates?.receipt?.allowedSizes || [],
            databaseName: window.aqsa7GetInstanceStorageConfig?.()?.databaseName || ''
          }));
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed: '+JSON.stringify(productContract.validation));
          if (!productContract.modules.includes('billing') || !productContract.modules.includes('receipts')) throw new Error('Shared module contract incomplete');
          if (!productContract.enabledModules.every(id => productContract.modules.includes(id))) throw new Error('Instance enables a module outside the product definition');
          if (!productContract.allowedReceiptSizes.includes(productContract.defaultReceiptSize)) throw new Error('Instance receipt default is outside the product template contract');
          if (!productContract.databaseName) throw new Error('Instance storage contract missing database name');

          const aiContract = await page.evaluate(() => ({
            manifest: window.AQSA7_AI_MANIFEST || null,
            ids: window.AQSA7_AI_MANIFEST ? Object.keys(window.AQSA7_AI_MANIFEST.capabilities) : [],
            frozenManifest: Object.isFrozen(window.AQSA7_AI_MANIFEST),
            frozenCapability: Object.isFrozen(window.AQSA7_AI_MANIFEST?.capabilities?.summarize),
            prompt: window.aqsa7GetAIPromptTemplate?.('summarize') || null,
            descriptor: (() => {
              try { return window.aqsa7CreateAIProviderDescriptor(window.aqsa7GetDefaultAIAdapter()); } catch (e) { return {error:String(e)}; }
            })(),
            disabledError: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', policy:{enabled:false}}); return null; } catch (e) { return String(e); }
            })(),
            externalDenied: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', external:true, policy:{enabled:true,allowExternalTransmission:false}}); return null; } catch (e) { return String(e); }
            })(),
            sensitiveDenied: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', sensitive:true, policy:{enabled:true,allowSensitiveData:false}}); return null; } catch (e) { return String(e); }
            })(),
            mockExecute: null,
            mockStream: null
          }));
          if (!aiContract.manifest || aiContract.manifest.layer !== 'platform-ai' || aiContract.manifest.providerIndependent !== true || aiContract.manifest.coreDependency !== false) throw new Error('AI platform contract missing/provider-coupled');
          if (aiContract.manifest.secrets !== 'none' || aiContract.manifest.persistence !== 'none') throw new Error('AI contract introduced secrets or persistence ownership');
          for (const id of ['summarize','extract','classify','search','generate','recommend']) if (!aiContract.ids.includes(id)) throw new Error('Missing AI capability: '+id);
          if (!aiContract.frozenManifest || !aiContract.frozenCapability) throw new Error('AI contract is mutable');
          if (!aiContract.prompt?.template || aiContract.prompt.version !== 1) throw new Error('AI prompt template contract missing');
          if (aiContract.descriptor?.id !== 'unconfigured' || !Array.isArray(aiContract.descriptor?.capabilities)) throw new Error('Default AI adapter must fail-soft as unconfigured');
          if (aiContract.disabledError !== 'Error: AQSA7_AI_DISABLED') throw new Error('AI disabled policy is not fail-closed');
          if (aiContract.externalDenied !== 'Error: AQSA7_AI_EXTERNAL_TRANSMISSION_DENIED') throw new Error('External AI transmission policy is not fail-closed');
          if (aiContract.sensitiveDenied !== 'Error: AQSA7_AI_SENSITIVE_DATA_DENIED') throw new Error('Sensitive-data AI policy is not fail-closed');
          const mockAI = await page.evaluate(async () => {
            const adapter = {
              getDescriptor: () => ({id:'test-local',name:'Test Local Adapter',kind:'test',local:true,capabilities:['summarize']}),
              supports: id => id === 'summarize',
              async execute(req){ return {text:'mock-summary', capabilityId:req.capabilityId}; },
              async *stream(req){ yield {type:'delta', text:'mock-'}; yield {type:'delta', text:'stream'}; }
            };
            const result = await window.aqsa7ExecuteAI({capabilityId:'summarize',input:'test',policy:{enabled:true}}, {adapter});
            const events = [];
            for await (const event of window.aqsa7StreamAI({capabilityId:'summarize',input:'test',policy:{enabled:true}}, {adapter})) events.push(event.event);
            return {result, events};
          });
          if (aiContract.manifest.providerAdapterContract.optionalMethods.indexOf('stream') === -1) throw new Error('AI streaming contract missing');
          if (mockAI.result?.status !== 'success' || mockAI.result?.providerId !== 'test-local' || mockAI.result?.result?.text !== 'mock-summary') throw new Error('AI provider execute contract failed: '+JSON.stringify(mockAI));
          if (mockAI.events?.length !== 2 || mockAI.events?.[1]?.text !== 'stream') throw new Error('AI provider streaming contract failed: '+JSON.stringify(mockAI));
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed after AI contract integration: '+JSON.stringify(productContract.validation));
          const integrationContract = await page.evaluate(async () => {
            const manifest = window.AQSA7_INTEGRATION_MANIFEST || null;
            const descriptor = (() => {
              try { return window.aqsa7CreateIntegrationAdapterDescriptor(window.aqsa7GetDefaultIntegrationAdapter()); } catch (e) { return {error:String(e)}; }
            })();
            const scoped = (() => {
              try { return window.aqsa7ValidateIntegrationRequest({capabilityId:'api',operation:'read',method:'GET'}); } catch (e) { return {error:String(e)}; }
            })();
            const idempotencyDenied = (() => {
              try { window.aqsa7ValidateIntegrationRequest({capabilityId:'api',operation:'write',method:'POST',retryPolicy:{automatic:true}}); return null; } catch (e) { return String(e); }
            })();
            const mock = {
              getDescriptor:()=>({id:'test-provider',name:'Test Provider',kind:'mock',version:'1.0',capabilities:['api','mapping','webhook'],local:true,platforms:['web','pwa','desktop','android']}),
              supports:(cap,op)=>cap==='api' && op==='read',
              async execute(req){ return {echo:req.payload || null, ownership:req.ownership}; },
              mapToExternal:(payload,profile)=>({profile:profile.id+':'+profile.version,value:payload.value}),
              mapFromExternal:(payload,profile)=>({profile:profile.id+':'+profile.version,value:payload.value}),
              verifyWebhook:(event)=>({valid:event.signature==='ok',deliveryId:event.deliveryId,eventType:event.type,payload:event.payload})
            };
            const result=await window.aqsa7ExecuteIntegration({integrationId:'test',capabilityId:'api',operation:'read',method:'GET',payload:{value:7}}, {adapter:mock});
            const mapped=window.aqsa7MapIntegrationData(mock,'toExternal',{value:8},{id:'test-map',version:'1'});
            const webhook=window.aqsa7VerifyIntegrationWebhook(mock,{signature:'ok',deliveryId:'d1',type:'test.event',payload:{ok:true}},{});
            const err=window.aqsa7NormalizeIntegrationError({code:'RATE_LIMITED',providerCode:'429',message:'rate',retryable:true},{integrationId:'test',providerId:'test-provider'});
            return {manifest,descriptor,scoped,idempotencyDenied,result,mapped,webhook,err};
          });
          if (!integrationContract.manifest || integrationContract.manifest.layer !== 'platform-integration' || integrationContract.manifest.providerIndependent !== true || integrationContract.manifest.coreDependency !== false) throw new Error('Integration platform contract missing/provider-coupled');
          if (integrationContract.manifest.persistence !== 'none' || integrationContract.manifest.secrets !== 'none') throw new Error('Integration contract owns persistence/secrets');
          for (const id of ['api','import','export','webhook','event','mapping']) if (!integrationContract.manifest.capabilities[id]) throw new Error('Missing integration capability: '+id);
          if (!integrationContract.descriptor?.id || !integrationContract.descriptor?.capabilities) throw new Error('Default integration adapter descriptor missing');
          if (!integrationContract.scoped?.identity?.tenantId || !integrationContract.scoped?.identity?.instanceId) throw new Error('Integration request lost instance ownership');
          if (integrationContract.idempotencyDenied !== 'Error: AQSA7_INTEGRATION_IDEMPOTENCY_REQUIRED') throw new Error('Integration retry/idempotency boundary failed');
          if (integrationContract.result?.status !== 'success' || integrationContract.result?.providerId !== 'test-provider' || integrationContract.result?.data?.ownership?.tenantId !== integrationContract.scoped.identity.tenantId) throw new Error('Integration adapter execute contract failed: '+JSON.stringify(integrationContract.result));
          if (integrationContract.mapped?.profile !== 'test-map:1' || integrationContract.mapped?.value !== 8) throw new Error('Integration mapping contract failed');
          if (integrationContract.webhook?.status !== 'verified' || integrationContract.webhook?.deliveryId !== 'd1' || integrationContract.webhook?.ownership?.instanceId !== integrationContract.scoped.identity.instanceId) throw new Error('Integration webhook boundary failed');
          if (integrationContract.err?.code !== 'RATE_LIMITED' || integrationContract.err?.providerCode !== '429' || integrationContract.err?.retryable !== true) throw new Error('Integration error normalization failed');
          const badWebhook = await page.evaluate(() => {
            try {
              const adapter={getDescriptor:()=>({id:'test',name:'Test',kind:'mock',version:'1',capabilities:['webhook']}),verifyWebhook:()=>({valid:false})};
              window.aqsa7VerifyIntegrationWebhook(adapter,{signature:'bad'},{});
              return null;
            } catch(e) { return String(e); }
          });
          if (badWebhook !== 'Error: AQSA7_INTEGRATION_WEBHOOK_REJECTED') throw new Error('Webhook rejection boundary failed');
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed after integration contract integration: '+JSON.stringify(productContract.validation));

          const isolation = await page.evaluate(async () => {
            const identity = typeof window.aqsa7GetInstanceIdentity === 'function' ? window.aqsa7GetInstanceIdentity() : null;
            const owned = typeof window.aqsa7OwnRecord === 'function' ? window.aqsa7OwnRecord({id:'isolation-smoke'}) : null;
            let recordMismatchRejected = false;
            let partialIdentityRejected = false;
            let backupMismatchRejected = false;
            try { window.aqsa7OwnRecord({...owned, tenantId:'foreign-tenant'}); } catch (_) { recordMismatchRejected = true; }
            try { window.aqsa7OwnRecord({id:'partial', tenantId:identity?.tenantId}); } catch (_) { partialIdentityRejected = true; }
            try { window.aqsa7ValidateBackupScope({...identity, tenantId:'foreign-tenant'}); } catch (_) { backupMismatchRejected = true; }
            const backup = typeof window.buildFullBackup === 'function' ? await window.buildFullBackup() : null;
            return {
              identity, owned, recordMismatchRejected, partialIdentityRejected, backupMismatchRejected,
              backupOwnership: backup?.ownership || null,
              backupSchemaVersion: backup?.schemaVersion || null,
              backupRecordIdentities: [...(backup?.receipts || []), ...(backup?.patients || [])].map(r => ({productId:r.productId, tenantId:r.tenantId, instanceId:r.instanceId}))
            };
          });
          if (!isolation.identity?.productId || !isolation.identity?.tenantId || !isolation.identity?.instanceId) throw new Error('Instance identity contract missing');
          if (isolation.owned.productId !== isolation.identity.productId || isolation.owned.tenantId !== isolation.identity.tenantId || isolation.owned.instanceId !== isolation.identity.instanceId) throw new Error('Unscoped record was not adopted into current instance scope');
          if (!isolation.recordMismatchRejected || !isolation.partialIdentityRejected || !isolation.backupMismatchRejected) throw new Error('Tenant/instance isolation fail-closed checks failed: '+JSON.stringify(isolation));
          if (isolation.backupOwnership?.scope !== 'instance' || isolation.backupOwnership.tenantId !== isolation.identity.tenantId || isolation.backupOwnership.instanceId !== isolation.identity.instanceId) throw new Error('Backup ownership scope missing');
          if (isolation.backupSchemaVersion !== 5) throw new Error('Backup schema was not upgraded for isolation contract');
          if (isolation.backupRecordIdentities.some(r => r.productId !== isolation.identity.productId || r.tenantId !== isolation.identity.tenantId || r.instanceId !== isolation.identity.instanceId)) throw new Error('Backup contains a record outside current instance scope');

          const backupCrypto = await page.evaluate(async () => {
            const artifact = {
              artifactType: 'AQSA7_BACKUP_ARTIFACT',
              artifactVersion: 1,
              schema: 'AQSA7_PRODUCT_BACKUP',
              schemaVersion: 5,
              exportedAt: '2026-10-08T00:00:00.000Z',
              ownership: {scope:'instance',productId:'aqsa7-test',tenantId:'tenant-test',instanceId:'instance-test',databaseName:'AQSA7_TEST_DB'},
              productId:'aqsa7-test',tenantId:'tenant-test',instanceId:'instance-test',
              receipts: [{id:'r1',productId:'aqsa7-test',tenantId:'tenant-test',instanceId:'instance-test'}],
              patients: [],
              settings: {clinic:{currency:'YER'},ui:{theme:'classic'}}
            };
            const password='AQSA7-' + crypto.randomUUID() + '-test';
            const envelope=await window.aqsa7EncryptBackupArtifact(artifact,password);
            const roundTrip=await window.aqsa7DecryptBackupArtifact(envelope,password);
            let tamperRejected=false,wrongKeyRejected=false,metadataRejected=false,incompatibleRejected=false;
            try {
              const tampered=JSON.parse(JSON.stringify(envelope));
              const bytes=Uint8Array.from(atob(tampered.ciphertext),c=>c.charCodeAt(0));
              bytes[0]^=1;
              tampered.ciphertext=btoa(String.fromCharCode(...bytes));
              await window.aqsa7DecryptBackupArtifact(tampered,password);
            } catch (_) { tamperRejected=true; }
            try { await window.aqsa7DecryptBackupArtifact(envelope,'wrong-password-test'); } catch (_) { wrongKeyRejected=true; }
            try {
              const bad=JSON.parse(JSON.stringify(envelope));
              bad.crypto.algorithm='AES-CBC-256';
              await window.aqsa7DecryptBackupArtifact(bad,password);
            } catch (_) { metadataRejected=true; }
            try {
              const bad=JSON.parse(JSON.stringify(envelope));
              bad.schemaVersion=999;
              await window.aqsa7DecryptBackupArtifact(bad,password);
            } catch (_) { incompatibleRejected=true; }
            return {
              manifest:window.aqsa7BackupCryptoManifest,
              envelope,
              roundTrip,
              tamperRejected,
              wrongKeyRejected,
              metadataRejected,
              incompatibleRejected
            };
          });
          if (backupCrypto.manifest?.algorithm !== 'AES-GCM-256' || backupCrypto.manifest?.kdf !== 'PBKDF2-HMAC-SHA256' || backupCrypto.manifest?.iterations !== 600000) throw new Error('Backup crypto contract metadata mismatch');
          if (backupCrypto.envelope?.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || backupCrypto.envelope?.artifactVersion !== 1 || backupCrypto.envelope?.schemaVersion !== 5) throw new Error('Encrypted backup artifact envelope contract failed');
          if (backupCrypto.envelope?.ciphertext === JSON.stringify(backupCrypto.roundTrip)) throw new Error('Backup plaintext appears to be stored as ciphertext');
          if (backupCrypto.roundTrip?.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || backupCrypto.roundTrip?.schemaVersion !== 5 || backupCrypto.roundTrip?.ownership?.instanceId !== 'instance-test') throw new Error('Encrypted backup round-trip lost artifact metadata or ownership');
          if (!backupCrypto.tamperRejected || !backupCrypto.wrongKeyRejected || !backupCrypto.metadataRejected || !backupCrypto.incompatibleRejected) throw new Error('Backup encryption fail-closed checks failed: '+JSON.stringify(backupCrypto));

          const backupEngine = await page.evaluate(async () => {
            const engine = window.aqsa7BackupEngine;
            if (!engine || engine.contract?.id !== 'aqsa7-backup-engine' || engine.contract?.version !== 1) {
              throw new Error('Generic Backup Engine contract missing.');
            }
            const artifact = await engine.createArtifact();
            const password = 'AQSA7-' + crypto.randomUUID() + '-engine-test';
            const envelope = await window.aqsa7EncryptBackupArtifact(artifact, password);
            const validated = await engine.decryptAndValidate(envelope, password);
            let plaintextRejected = false;
            try {
              await engine.decryptAndValidate(artifact, password);
            } catch (_) { plaintextRejected = true; }
            return {
              contract: engine.contract,
              artifact: {artifactType:artifact.artifactType,artifactVersion:artifact.artifactVersion,schemaVersion:artifact.schemaVersion},
              ownership: artifact.ownership,
              validatedOwnership: validated.ownership,
              plaintextRejected
            };
          });
          if (backupEngine.contract?.providerIndependent !== true || backupEngine.contract?.persistenceOwner !== 'repository-indexeddb') throw new Error('Backup Engine introduced provider/persistence ownership: '+JSON.stringify(backupEngine.contract));
          if (backupEngine.artifact?.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || backupEngine.artifact?.artifactVersion !== 1 || backupEngine.artifact?.schemaVersion !== 5) throw new Error('Backup Engine artifact contract failed: '+JSON.stringify(backupEngine.artifact));
          if (!backupEngine.ownership?.tenantId || !backupEngine.ownership?.instanceId || backupEngine.ownership.tenantId !== backupEngine.validatedOwnership?.tenantId || backupEngine.ownership.instanceId !== backupEngine.validatedOwnership?.instanceId) throw new Error('Backup Engine lost ownership boundary: '+JSON.stringify(backupEngine));
          if (!backupEngine.plaintextRejected) throw new Error('Backup Engine accepted plaintext as an encrypted artifact.');

          const backupDelegation = await page.evaluate(async () => {
            const originalPassword = window.aqsa7RequestBackupPassword;
            const originalDownload = window.downloadTextFile;
            const originalAlert = window.alert;
            let captured = null;
            window.aqsa7RequestBackupPassword = () => 'AQSA7-' + crypto.randomUUID() + '-export-test';

name: AQSA7 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax validation
        run: |
          for file in js/*.js; do node --check "$file"; done

      - name: Verify AI vendor isolation in business/platform modules
        run: |
          if grep -Eri -- 'openai|anthropic|google-generative-ai|google/genai|mistralai|cohere|groq' js/product.js js/capabilities.js js/repository.js js/storage.js js/app.js; then
            echo 'Direct AI vendor/SDK reference leaked into core or business modules.'
            exit 1
          fi

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aqsa7-http.log 2>&1 &
          echo $! >/tmp/aqsa7-http.pid
          sleep 2

      - name: Run mobile browser smoke
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

          const title = await page.title();
          if (!title.includes('سند قبض مالي')) throw new Error('Unexpected page title');

          const designTokens = await page.evaluate(() => {
            const root = getComputedStyle(document.documentElement);
            const token = name => root.getPropertyValue(name).trim();
            const tab = document.querySelector('#tabReceipt');
            return {
              primary: token('--color-primary'),
              paid: token('--color-paid'),
              warning: token('--color-warning'),
              surface: token('--color-surface'),
              white: token('--color-white'),
              border: token('--color-border'),
              fontUi: token('--font-ui'),
              touchTarget: token('--touch-target'),
              tabHeight: tab ? Math.round(tab.getBoundingClientRect().height) : 0
            };
          });
          const expectedTokens = {
            primary: '#1E3A8A',
            paid: '#059669',
            warning: '#D97706',
            surface: '#F8FAFC',
            white: '#FFFFFF',
            border: '#E2E8F0',
            touchTarget: '44px'
          };
          for (const [key, expected] of Object.entries(expectedTokens)) {
            const actual = designTokens[key].toUpperCase();
            if (actual !== expected.toUpperCase()) throw new Error('Design token mismatch '+key+': '+designTokens[key]);
          }
          if (!designTokens.fontUi.includes('system-ui')) throw new Error('UI font token is not system-ui based');
          if (designTokens.tabHeight < 44) throw new Error('Receipt tab touch target is below 44px: '+designTokens.tabHeight);

          const productBoundary = await page.evaluate(() => ({
            manifest: window.AQSA7_PRODUCT_MANIFEST,
            clinic: window.AQSA7_CLINIC_CONFIG,
            stamped: typeof window.aqsa7StampRecord === 'function' ? window.aqsa7StampRecord({id:'smoke-record'}) : null
          }));
          if (!productBoundary.manifest || productBoundary.manifest.productId !== 'dental-clinic') throw new Error('Product manifest boundary missing');
          if (!productBoundary.manifest.capabilities.includes('patients') || !productBoundary.manifest.capabilities.includes('receipts')) throw new Error('Dental product capability manifest incomplete');
          if (!productBoundary.manifest.optionalCapabilities.includes('ai')) throw new Error('AI capability boundary missing');
          if (!productBoundary.clinic || productBoundary.clinic.productId !== 'dental-clinic' || !productBoundary.clinic.tenantId || !productBoundary.clinic.instanceId) throw new Error('Clinic instance configuration boundary missing');
          if (productBoundary.stamped.productId !== 'dental-clinic' || productBoundary.stamped.tenantId !== productBoundary.clinic.tenantId || productBoundary.stamped.instanceId !== productBoundary.clinic.instanceId) throw new Error('Repository record identity stamping failed');
          const productContract = await page.evaluate(() => ({
            validation: typeof window.aqsa7ValidateProductDefinition === 'function' ? window.aqsa7ValidateProductDefinition() : null,
            modules: window.AQSA7_PRODUCT_MANIFEST?.modules || [],
            enabledModules: window.AQSA7_CLINIC_CONFIG?.enabledModules || [],
            defaultReceiptSize: window.AQSA7_CLINIC_CONFIG?.documentTemplates?.receipt?.defaultSize,
            allowedReceiptSizes: window.AQSA7_CLINIC_CONFIG?.documentTemplates?.receipt?.allowedSizes || [],
            databaseName: window.aqsa7GetInstanceStorageConfig?.()?.databaseName || ''
          }));
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed: '+JSON.stringify(productContract.validation));
          if (!productContract.modules.includes('billing') || !productContract.modules.includes('receipts')) throw new Error('Shared module contract incomplete');
          if (!productContract.enabledModules.every(id => productContract.modules.includes(id))) throw new Error('Instance enables a module outside the product definition');
          if (!productContract.allowedReceiptSizes.includes(productContract.defaultReceiptSize)) throw new Error('Instance receipt default is outside the product template contract');
          if (!productContract.databaseName) throw new Error('Instance storage contract missing database name');

          const aiContract = await page.evaluate(() => ({
            manifest: window.AQSA7_AI_MANIFEST || null,
            ids: window.AQSA7_AI_MANIFEST ? Object.keys(window.AQSA7_AI_MANIFEST.capabilities) : [],
            frozenManifest: Object.isFrozen(window.AQSA7_AI_MANIFEST),
            frozenCapability: Object.isFrozen(window.AQSA7_AI_MANIFEST?.capabilities?.summarize),
            prompt: window.aqsa7GetAIPromptTemplate?.('summarize') || null,
            descriptor: (() => {
              try { return window.aqsa7CreateAIProviderDescriptor(window.aqsa7GetDefaultAIAdapter()); } catch (e) { return {error:String(e)}; }
            })(),
            disabledError: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', policy:{enabled:false}}); return null; } catch (e) { return String(e); }
            })(),
            externalDenied: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', external:true, policy:{enabled:true,allowExternalTransmission:false}}); return null; } catch (e) { return String(e); }
            })(),
            sensitiveDenied: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', sensitive:true, policy:{enabled:true,allowSensitiveData:false}}); return null; } catch (e) { return String(e); }
            })(),
            mockExecute: null,
            mockStream: null
          }));
          if (!aiContract.manifest || aiContract.manifest.layer !== 'platform-ai' || aiContract.manifest.providerIndependent !== true || aiContract.manifest.coreDependency !== false) throw new Error('AI platform contract missing/provider-coupled');
          if (aiContract.manifest.secrets !== 'none' || aiContract.manifest.persistence !== 'none') throw new Error('AI contract introduced secrets or persistence ownership');
          for (const id of ['summarize','extract','classify','search','generate','recommend']) if (!aiContract.ids.includes(id)) throw new Error('Missing AI capability: '+id);
          if (!aiContract.frozenManifest || !aiContract.frozenCapability) throw new Error('AI contract is mutable');
          if (!aiContract.prompt?.template || aiContract.prompt.version !== 1) throw new Error('AI prompt template contract missing');
          if (aiContract.descriptor?.id !== 'unconfigured' || !Array.isArray(aiContract.descriptor?.capabilities)) throw new Error('Default AI adapter must fail-soft as unconfigured');
          if (aiContract.disabledError !== 'Error: AQSA7_AI_DISABLED') throw new Error('AI disabled policy is not fail-closed');
          if (aiContract.externalDenied !== 'Error: AQSA7_AI_EXTERNAL_TRANSMISSION_DENIED') throw new Error('External AI transmission policy is not fail-closed');
          if (aiContract.sensitiveDenied !== 'Error: AQSA7_AI_SENSITIVE_DATA_DENIED') throw new Error('Sensitive-data AI policy is not fail-closed');
          const mockAI = await page.evaluate(async () => {
            const adapter = {
              getDescriptor: () => ({id:'test-local',name:'Test Local Adapter',kind:'test',local:true,capabilities:['summarize']}),
              supports: id => id === 'summarize',
              async execute(req){ return {text:'mock-summary', capabilityId:req.capabilityId}; },
              async *stream(req){ yield {type:'delta', text:'mock-'}; yield {type:'delta', text:'stream'}; }
            };
            const result = await window.aqsa7ExecuteAI({capabilityId:'summarize',input:'test',policy:{enabled:true}}, {adapter});
            const events = [];
            for await (const event of window.aqsa7StreamAI({capabilityId:'summarize',input:'test',policy:{enabled:true}}, {adapter})) events.push(event.event);
            return {result, events};
          });
          if (aiContract.manifest.providerAdapterContract.optionalMethods.indexOf('stream') === -1) throw new Error('AI streaming contract missing');
          if (mockAI.result?.status !== 'success' || mockAI.result?.providerId !== 'test-local' || mockAI.result?.result?.text !== 'mock-summary') throw new Error('AI provider execute contract failed: '+JSON.stringify(mockAI));
          if (mockAI.events?.length !== 2 || mockAI.events?.[1]?.text !== 'stream') throw new Error('AI provider streaming contract failed: '+JSON.stringify(mockAI));
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed after AI contract integration: '+JSON.stringify(productContract.validation));
          const integrationContract = await page.evaluate(async () => {
            const manifest = window.AQSA7_INTEGRATION_MANIFEST || null;
            const descriptor = (() => {
              try { return window.aqsa7CreateIntegrationAdapterDescriptor(window.aqsa7GetDefaultIntegrationAdapter()); } catch (e) { return {error:String(e)}; }
            })();
            const scoped = (() => {
              try { return window.aqsa7ValidateIntegrationRequest({capabilityId:'api',operation:'read',method:'GET'}); } catch (e) { return {error:String(e)}; }
            })();
            const idempotencyDenied = (() => {
              try { window.aqsa7ValidateIntegrationRequest({capabilityId:'api',operation:'write',method:'POST',retryPolicy:{automatic:true}}); return null; } catch (e) { return String(e); }
            })();
            const mock = {
              getDescriptor:()=>({id:'test-provider',name:'Test Provider',kind:'mock',version:'1.0',capabilities:['api','mapping','webhook'],local:true,platforms:['web','pwa','desktop','android']}),
              supports:(cap,op)=>cap==='api' && op==='read',
              async execute(req){ return {echo:req.payload || null, ownership:req.ownership}; },
              mapToExternal:(payload,profile)=>({profile:profile.id+':'+profile.version,value:payload.value}),
              mapFromExternal:(payload,profile)=>({profile:profile.id+':'+profile.version,value:payload.value}),
              verifyWebhook:(event)=>({valid:event.signature==='ok',deliveryId:event.deliveryId,eventType:event.type,payload:event.payload})
            };
            const result=await window.aqsa7ExecuteIntegration({integrationId:'test',capabilityId:'api',operation:'read',method:'GET',payload:{value:7}}, {adapter:mock});
            const mapped=window.aqsa7MapIntegrationData(mock,'toExternal',{value:8},{id:'test-map',version:'1'});
            const webhook=window.aqsa7VerifyIntegrationWebhook(mock,{signature:'ok',deliveryId:'d1',type:'test.event',payload:{ok:true}},{});
            const err=window.aqsa7NormalizeIntegrationError({code:'RATE_LIMITED',providerCode:'429',message:'rate',retryable:true},{integrationId:'test',providerId:'test-provider'});
            return {manifest,descriptor,scoped,idempotencyDenied,result,mapped,webhook,err};
          });
          if (!integrationContract.manifest || integrationContract.manifest.layer !== 'platform-integration' || integrationContract.manifest.providerIndependent !== true || integrationContract.manifest.coreDependency !== false) throw new Error('Integration platform contract missing/provider-coupled');
          if (integrationContract.manifest.persistence !== 'none' || integrationContract.manifest.secrets !== 'none') throw new Error('Integration contract owns persistence/secrets');
          for (const id of ['api','import','export','webhook','event','mapping']) if (!integrationContract.manifest.capabilities[id]) throw new Error('Missing integration capability: '+id);
          if (!integrationContract.descriptor?.id || !integrationContract.descriptor?.capabilities) throw new Error('Default integration adapter descriptor missing');
          if (!integrationContract.scoped?.identity?.tenantId || !integrationContract.scoped?.identity?.instanceId) throw new Error('Integration request lost instance ownership');
          if (integrationContract.idempotencyDenied !== 'Error: AQSA7_INTEGRATION_IDEMPOTENCY_REQUIRED') throw new Error('Integration retry/idempotency boundary failed');
          if (integrationContract.result?.status !== 'success' || integrationContract.result?.providerId !== 'test-provider' || integrationContract.result?.data?.ownership?.tenantId !== integrationContract.scoped.identity.tenantId) throw new Error('Integration adapter execute contract failed: '+JSON.stringify(integrationContract.result));
          if (integrationContract.mapped?.profile !== 'test-map:1' || integrationContract.mapped?.value !== 8) throw new Error('Integration mapping contract failed');
          if (integrationContract.webhook?.status !== 'verified' || integrationContract.webhook?.deliveryId !== 'd1' || integrationContract.webhook?.ownership?.instanceId !== integrationContract.scoped.identity.instanceId) throw new Error('Integration webhook boundary failed');
          if (integrationContract.err?.code !== 'RATE_LIMITED' || integrationContract.err?.providerCode !== '429' || integrationContract.err?.retryable !== true) throw new Error('Integration error normalization failed');
          const badWebhook = await page.evaluate(() => {
            try {
              const adapter={getDescriptor:()=>({id:'test',name:'Test',kind:'mock',version:'1',capabilities:['webhook']}),verifyWebhook:()=>({valid:false})};
              window.aqsa7VerifyIntegrationWebhook(adapter,{signature:'bad'},{});
              return null;
            } catch(e) { return String(e); }
          });
          if (badWebhook !== 'Error: AQSA7_INTEGRATION_WEBHOOK_REJECTED') throw new Error('Webhook rejection boundary failed');
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed after integration contract integration: '+JSON.stringify(productContract.validation));

          const isolation = await page.evaluate(async () => {
            const identity = typeof window.aqsa7GetInstanceIdentity === 'function' ? window.aqsa7GetInstanceIdentity() : null;
            const owned = typeof window.aqsa7OwnRecord === 'function' ? window.aqsa7OwnRecord({id:'isolation-smoke'}) : null;
            let recordMismatchRejected = false;
            let partialIdentityRejected = false;
            let backupMismatchRejected = false;
            try { window.aqsa7OwnRecord({...owned, tenantId:'foreign-tenant'}); } catch (_) { recordMismatchRejected = true; }
            try { window.aqsa7OwnRecord({id:'partial', tenantId:identity?.tenantId}); } catch (_) { partialIdentityRejected = true; }
            try { window.aqsa7ValidateBackupScope({...identity, tenantId:'foreign-tenant'}); } catch (_) { backupMismatchRejected = true; }
            const backup = typeof window.buildFullBackup === 'function' ? await window.buildFullBackup() : null;
            return {
              identity, owned, recordMismatchRejected, partialIdentityRejected, backupMismatchRejected,
              backupOwnership: backup?.ownership || null,
              backupSchemaVersion: backup?.schemaVersion || null,
              backupRecordIdentities: [...(backup?.receipts || []), ...(backup?.patients || [])].map(r => ({productId:r.productId, tenantId:r.tenantId, instanceId:r.instanceId}))
            };
          });
          if (!isolation.identity?.productId || !isolation.identity?.tenantId || !isolation.identity?.instanceId) throw new Error('Instance identity contract missing');
          if (isolation.owned.productId !== isolation.identity.productId || isolation.owned.tenantId !== isolation.identity.tenantId || isolation.owned.instanceId !== isolation.identity.instanceId) throw new Error('Unscoped record was not adopted into current instance scope');
          if (!isolation.recordMismatchRejected || !isolation.partialIdentityRejected || !isolation.backupMismatchRejected) throw new Error('Tenant/instance isolation fail-closed checks failed: '+JSON.stringify(isolation));
          if (isolation.backupOwnership?.scope !== 'instance' || isolation.backupOwnership.tenantId !== isolation.identity.tenantId || isolation.backupOwnership.instanceId !== isolation.identity.instanceId) throw new Error('Backup ownership scope missing');
          if (isolation.backupSchemaVersion !== 5) throw new Error('Backup schema was not upgraded for isolation contract');
          if (isolation.backupRecordIdentities.some(r => r.productId !== isolation.identity.productId || r.tenantId !== isolation.identity.tenantId || r.instanceId !== isolation.identity.instanceId)) throw new Error('Backup contains a record outside current instance scope');

          const backupCrypto = await page.evaluate(async () => {
            const artifact = {
              artifactType: 'AQSA7_BACKUP_ARTIFACT',
              artifactVersion: 1,
              schema: 'AQSA7_PRODUCT_BACKUP',
              schemaVersion: 5,
              exportedAt: '2026-10-08T00:00:00.000Z',
              ownership: {scope:'instance',productId:'aqsa7-test',tenantId:'tenant-test',instanceId:'instance-test',databaseName:'AQSA7_TEST_DB'},
              productId:'aqsa7-test',tenantId:'tenant-test',instanceId:'instance-test',
              receipts: [{id:'r1',productId:'aqsa7-test',tenantId:'tenant-test',instanceId:'instance-test'}],
              patients: [],
              settings: {clinic:{currency:'YER'},ui:{theme:'classic'}}
            };
            const password='AQSA7-' + crypto.randomUUID() + '-test';
            const envelope=await window.aqsa7EncryptBackupArtifact(artifact,password);
            const roundTrip=await window.aqsa7DecryptBackupArtifact(envelope,password);
            let tamperRejected=false,wrongKeyRejected=false,metadataRejected=false,incompatibleRejected=false;
            try {
              const tampered=JSON.parse(JSON.stringify(envelope));
              const bytes=Uint8Array.from(atob(tampered.ciphertext),c=>c.charCodeAt(0));
              bytes[0]^=1;
              tampered.ciphertext=btoa(String.fromCharCode(...bytes));
              await window.aqsa7DecryptBackupArtifact(tampered,password);
            } catch (_) { tamperRejected=true; }
            try { await window.aqsa7DecryptBackupArtifact(envelope,'wrong-password-test'); } catch (_) { wrongKeyRejected=true; }
            try {
              const bad=JSON.parse(JSON.stringify(envelope));
              bad.crypto.algorithm='AES-CBC-256';
              await window.aqsa7DecryptBackupArtifact(bad,password);
            } catch (_) { metadataRejected=true; }
            try {
              const bad=JSON.parse(JSON.stringify(envelope));
              bad.schemaVersion=999;
              await window.aqsa7DecryptBackupArtifact(bad,password);
            } catch (_) { incompatibleRejected=true; }
            return {
              manifest:window.aqsa7BackupCryptoManifest,
              envelope,
              roundTrip,
              tamperRejected,
              wrongKeyRejected,
              metadataRejected,
              incompatibleRejected
            };
          });
          if (backupCrypto.manifest?.algorithm !== 'AES-GCM-256' || backupCrypto.manifest?.kdf !== 'PBKDF2-HMAC-SHA256' || backupCrypto.manifest?.iterations !== 600000) throw new Error('Backup crypto contract metadata mismatch');
          if (backupCrypto.envelope?.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || backupCrypto.envelope?.artifactVersion !== 1 || backupCrypto.envelope?.schemaVersion !== 5) throw new Error('Encrypted backup artifact envelope contract failed');
          if (backupCrypto.envelope?.ciphertext === JSON.stringify(backupCrypto.roundTrip)) throw new Error('Backup plaintext appears to be stored as ciphertext');
          if (backupCrypto.roundTrip?.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || backupCrypto.roundTrip?.schemaVersion !== 5 || backupCrypto.roundTrip?.ownership?.instanceId !== 'instance-test') throw new Error('Encrypted backup round-trip lost artifact metadata or ownership');
          if (!backupCrypto.tamperRejected || !backupCrypto.wrongKeyRejected || !backupCrypto.metadataRejected || !backupCrypto.incompatibleRejected) throw new Error('Backup encryption fail-closed checks failed: '+JSON.stringify(backupCrypto));

          const backupEngine = await page.evaluate(async () => {
            const engine = window.aqsa7BackupEngine;
            if (!engine || engine.contract?.id !== 'aqsa7-backup-engine' || engine.contract?.version !== 1) {
              throw new Error('Generic Backup Engine contract missing.');
            }
            const artifact = await engine.createArtifact();
            const password = 'AQSA7-' + crypto.randomUUID() + '-engine-test';
            const envelope = await window.aqsa7EncryptBackupArtifact(artifact, password);
            const validated = await engine.decryptAndValidate(envelope, password);
            let plaintextRejected = false;
            try {
              await engine.decryptAndValidate(artifact, password);
            } catch (_) { plaintextRejected = true; }
            return {
              contract: engine.contract,
              artifact: {artifactType:artifact.artifactType,artifactVersion:artifact.artifactVersion,schemaVersion:artifact.schemaVersion},
              ownership: artifact.ownership,
              validatedOwnership: validated.ownership,
              plaintextRejected
            };
          });
          if (backupEngine.contract?.providerIndependent !== true || backupEngine.contract?.persistenceOwner !== 'repository-indexeddb') throw new Error('Backup Engine introduced provider/persistence ownership: '+JSON.stringify(backupEngine.contract));
          if (backupEngine.artifact?.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || backupEngine.artifact?.artifactVersion !== 1 || backupEngine.artifact?.schemaVersion !== 5) throw new Error('Backup Engine artifact contract failed: '+JSON.stringify(backupEngine.artifact));
          if (!backupEngine.ownership?.tenantId || !backupEngine.ownership?.instanceId || backupEngine.ownership.tenantId !== backupEngine.validatedOwnership?.tenantId || backupEngine.ownership.instanceId !== backupEngine.validatedOwnership?.instanceId) throw new Error('Backup Engine lost ownership boundary: '+JSON.stringify(backupEngine));
          if (!backupEngine.plaintextRejected) throw new Error('Backup Engine accepted plaintext as an encrypted artifact.');

          const backupDelegation = await page.evaluate(async () => {
            const originalPassword = window.aqsa7RequestBackupPassword;
            const originalDownload = window.downloadTextFile;
            const originalAlert = window.alert;
            let captured = null;
            window.aqsa7RequestBackupPassword = () => 'AQSA7-' + crypto.randomUUID() + '-export-test';
            window.downloadTextFile = (filename, content, mime) => { captured = {filename, content, mime}; };
            window.alert = () => {};
            try {
              await window.aqsa7BackupEngine.exportFullBackup();
              return captured;
            } finally {
              window.aqsa7RequestBackupPassword = originalPassword;
              window.downloadTextFile = originalDownload;
              window.alert = originalAlert;
            }
          });
          if (!backupDelegation?.filename?.endsWith('.aqsa7.json') || backupDelegation.mime !== 'application/json') throw new Error('Backup Engine export orchestration failed: '+JSON.stringify(backupDelegation));
          const exportedEnvelope = JSON.parse(backupDelegation.content);
          if (exportedEnvelope.artifactType !== 'AQSA7_BACKUP_ARTIFACT' || !exportedEnvelope.crypto || !exportedEnvelope.ciphertext) throw new Error('Backup Engine export did not produce an encrypted artifact.');

          const backupProvider = await page.evaluate(async () => {
            const contract = window.AQSA7_BACKUP_PROVIDER_CONTRACT;
            if (!contract || contract.contractId !== 'aqsa7-backup-provider-adapter-contract' || contract.schemaVersion !== 1) {
              throw new Error('Backup Provider Adapter Contract missing.');
            }
            if (contract.providerIndependent !== true || contract.enabledByDefault !== false || contract.coreDependency !== false) {
              throw new Error('Backup Provider contract violates provider-independent/local-first boundary.');
            }
            const identity = {productId:'dental-clinic',tenantId:'tenant-test',instanceId:'instance-test'};
            const engineArtifact = await window.aqsa7BackupEngine.createArtifact();
            const password = 'AQSA7-' + crypto.randomUUID() + '-provider-test';
            const encrypted = await window.aqsa7EncryptBackupArtifact(engineArtifact,password);
            const fake = {
              getDescriptor: () => ({id:'test-provider',name:'Test Provider',kind:'test',version:'1',operations:['health','list','put','get','delete'],platforms:['web','pwa','desktop','android']}),
              health: async () => ({status:'success'}),
              list: async request => ({status:'success',items:[],ownership:request.ownership}),
              put: async request => ({status:'success',backupId:'backup-test',ownership:request.ownership}),
              get: async request => ({status:'success',artifact:request.artifact,ownership:request.ownership}),
              delete: async request => ({status:'success',backupId:request.backupId,ownership:request.ownership})
            };
            const descriptor = window.aqsa7ValidateBackupProviderAdapter(fake);
            const putRequest = window.aqsa7CreateBackupProviderRequest('put',identity,encrypted,{idempotencyKey:'provider-test-1'});
            const putResult = await window.aqsa7ExecuteBackupProvider(fake,'put',identity,{artifact:encrypted,idempotencyKey:'provider-test-1'});
            let plaintextRejected = false;
            try { window.aqsa7ValidateBackupProviderArtifact(engineArtifact); } catch (_) { plaintextRejected = true; }
            let foreignRequestRejected = false;
            try { window.aqsa7CreateBackupProviderRequest('put',{productId:'dental-clinic',tenantId:'tenant-test'},encrypted); } catch (_) { foreignRequestRejected = true; }
            return {
              contract,
              descriptor,
              requestOwnership: putRequest.ownership,
              result: putResult,
              plaintextRejected,
              foreignRequestRejected
            };
          });
          if (backupProvider.descriptor?.id !== 'test-provider') throw new Error('Backup Provider descriptor validation failed: '+JSON.stringify(backupProvider));
          if (backupProvider.requestOwnership?.tenantId !== 'tenant-test' || backupProvider.requestOwnership?.instanceId !== 'instance-test') throw new Error('Backup Provider ownership propagation failed: '+JSON.stringify(backupProvider));
          if (backupProvider.result?.status !== 'success' || backupProvider.result?.providerId !== 'test-provider') throw new Error('Backup Provider execution contract failed: '+JSON.stringify(backupProvider));
          if (!backupProvider.plaintextRejected || !backupProvider.foreignRequestRejected) throw new Error('Backup Provider security/ownership boundary failed: '+JSON.stringify(backupProvider));

          const restoreMigration = await page.evaluate(async () => {
            const contract = window.AQSA7_RESTORE_MIGRATION_CONTRACT;
            if (!contract || contract.contractId !== 'aqsa7-restore-migration-engine' || contract.schemaVersion !== 1 || contract.currentSchemaVersion !== 5) {
              throw new Error('Restore/Migration Engine contract missing or incompatible.');
            }
            const artifact = await window.aqsa7BackupEngine.createArtifact();
            const plan = window.aqsa7PlanRestoreMigration(artifact);
            const migrated = window.aqsa7MigrateRestoreArtifact(artifact);
            const prepared = window.aqsa7PrepareRestoreArtifact({
              artifactType:'AQSA7_BACKUP_ARTIFACT',
              artifactVersion:1,
              crypto:{version:1,algorithm:'AES-GCM-256'},
              ciphertext:'opaque-test'
            },artifact);
            let oldSchemaRejected=false;
            try {
              window.aqsa7PlanRestoreMigration({...artifact,schemaVersion:4});
            } catch (_) { oldSchemaRejected=true; }
            let futureSchemaRejected=false;
            try {
              window.aqsa7PlanRestoreMigration({...artifact,schemaVersion:999});
            } catch (_) { futureSchemaRejected=true; }
            let foreignRejected=false;
            try {
              window.aqsa7PlanRestoreMigration({...artifact,tenantId:'foreign-tenant'});
            } catch (_) { foreignRejected=true; }
            return {
              contract,
              plan,
              migrated:{schemaVersion:migrated.schemaVersion,productId:migrated.productId,tenantId:migrated.tenantId,instanceId:migrated.instanceId},
              prepared:{validated:prepared.validated,migrationId:prepared.plan.migrationId},
              oldSchemaRejected,
              futureSchemaRejected,
              foreignRejected
            };
          });
          if (restoreMigration.plan?.fromSchemaVersion !== 5 || restoreMigration.plan?.toSchemaVersion !== 5 || restoreMigration.plan?.requiresTransform !== false) throw new Error('Restore migration plan failed: '+JSON.stringify(restoreMigration));
          if (restoreMigration.migrated?.schemaVersion !== 5 || !restoreMigration.migrated?.tenantId || !restoreMigration.migrated?.instanceId) throw new Error('Restore migration lost ownership/schema metadata: '+JSON.stringify(restoreMigration));
          if (!restoreMigration.prepared?.validated || restoreMigration.prepared?.migrationId !== 'AQSA7_BACKUP_5_IDENTITY') throw new Error('Restore preparation failed: '+JSON.stringify(restoreMigration));
          if (!restoreMigration.oldSchemaRejected || !restoreMigration.futureSchemaRejected || !restoreMigration.foreignRejected) throw new Error('Restore migration fail-closed compatibility/ownership checks failed: '+JSON.stringify(restoreMigration));

          const localBackupUx = await page.evaluate(() => {
            const ux = window.aqsa7LocalBackupUX;
            if (!ux || typeof ux.markBackupCreated !== 'function' || typeof ux.openRestorePicker !== 'function') throw new Error('Local Backup / Recovery UX missing.');
            const before = ux.getState();
            ux.markBackupCreated();
            const after = ux.getState();
            return {
              stateRecorded: !!after.lastBackupAt && !Number.isNaN(Date.parse(after.lastBackupAt)),
              statusExists: !!document.getElementById('backupLocalStatus'),
              lastExists: !!document.getElementById('backupLastLocal'),
              hintExists: !!document.getElementById('backupRecoveryHint'),
              restoreInput: !!document.getElementById('backupImporter'),
              encryptedLabel: document.body.innerText.includes('إنشاء Backup مشفر'),
              recoveryLabel: document.body.innerText.includes('استعادة Backup')
            };
          });
          if (!localBackupUx.stateRecorded || !localBackupUx.statusExists || !localBackupUx.lastExists || !localBackupUx.hintExists || !localBackupUx.restoreInput) throw new Error('Local Backup UX state/status contract failed: '+JSON.stringify(localBackupUx));
          if (!localBackupUx.restoreInput) throw new Error('Local Backup restore input is not available: '+JSON.stringify(localBackupUx));

          const backupScheduling = await page.evaluate(() => {
            const scheduler = window.aqsa7BackupScheduling;
            const contract = window.AQSA7_BACKUP_SCHEDULING_CONTRACT;
            if (!scheduler || !contract) throw new Error('Backup Scheduling / Reliability contract missing.');
            if (contract.contractId !== 'aqsa7-backup-scheduling-reliability' || contract.schemaVersion !== 1 || contract.mode !== 'local-reminder') {
              throw new Error('Backup Scheduling contract is incompatible: '+JSON.stringify(contract));
            }
            const original = scheduler.getStatus();
            scheduler.setIntervalDays(7);
            scheduler.setEnabled(true);
            const configured = scheduler.getStatus();
            scheduler.setEnabled(false);
            const disabled = scheduler.getStatus();
            scheduler.setEnabled(original.state.enabled);
            scheduler.setIntervalDays(original.state.intervalDays);
            scheduler.render();
            return {
              configuredInterval: configured.state.intervalDays,
              configuredEnabled: configured.state.enabled,
              disabledEnabled: disabled.state.enabled,
              automaticBackgroundExport: contract.automaticBackgroundExport,
              card: !!document.getElementById('backupScheduleCard'),
              toggle: !!document.getElementById('backupScheduleToggle'),
              interval: !!document.getElementById('backupScheduleInterval'),
              status: !!document.getElementById('backupScheduleStatus')
            };
          });
          if (backupScheduling.configuredInterval !== 7 || !backupScheduling.configuredEnabled || backupScheduling.disabledEnabled || backupScheduling.automaticBackgroundExport !== false || !backupScheduling.card || !backupScheduling.toggle || !backupScheduling.interval || !backupScheduling.status) {
            throw new Error('Backup Scheduling / Reliability boundary failed: '+JSON.stringify(backupScheduling));
          }





          const backupProviderRuntime = await page.evaluate(async () => {
            const runtime = window.aqsa7BackupProviderRuntime;
            const contract = window.AQSA7_BACKUP_PROVIDER_RUNTIME_CONTRACT;
            const baseContract = window.AQSA7_BACKUP_PROVIDER_CONTRACT;
            if (!runtime || !contract || !baseContract) throw new Error('Backup Provider runtime boundary missing.');
            if (contract.contractId !== 'aqsa7-backup-provider-runtime' || contract.schemaVersion !== 1 || contract.providerIndependent !== true || contract.persistence !== 'memory-only' || contract.secretStorage !== false) {
              throw new Error('Backup Provider runtime contract incompatible: '+JSON.stringify(contract));
            }
            runtime.clear();
            const fake = {
              getDescriptor:()=>({id:'runtime-smoke-provider',name:'Runtime Smoke Provider',version:'1',operations:['health'],platforms:['web','pwa','desktop','android']}),
              health:async()=>({status:'success',providerId:'runtime-smoke-provider',operation:'health'}),
              list:async()=>({status:'error',error:{code:'UNAVAILABLE'}}),
              put:async()=>({status:'error',error:{code:'UNAVAILABLE'}}),
              get:async()=>({status:'error',error:{code:'UNAVAILABLE'}}),
              delete:async()=>({status:'error',error:{code:'UNAVAILABLE'}})
            };
            const descriptor = runtime.register(fake);
            const listed = runtime.list();
            const health = await runtime.health('runtime-smoke-provider',{productId:'aqsa7',tenantId:'smoke-tenant',instanceId:'smoke-instance'});
            const duplicateRejected = (()=>{ try { runtime.register(fake); return false; } catch (_) { return true; } })();
            const removed = runtime.unregister('runtime-smoke-provider');
            return {descriptorId:descriptor.id,listed:listed.length,healthStatus:health.status,duplicateRejected,removed,afterRemove:runtime.list().length};
          });
          if (backupProviderRuntime.descriptorId !== 'runtime-smoke-provider' || backupProviderRuntime.listed !== 1 || backupProviderRuntime.healthStatus !== 'success' || !backupProviderRuntime.duplicateRejected || !backupProviderRuntime.removed || backupProviderRuntime.afterRemove !== 0) {
            throw new Error('Backup Provider runtime registry failed: '+JSON.stringify(backupProviderRuntime));
          }
          const googleDriveProviderSmoke = await page.evaluate(async () => {
            const providerFactory = window.aqsa7CreateGoogleDriveBackupProvider;
            const providerContract = window.AQSA7_GOOGLE_DRIVE_PROVIDER_CONTRACT;
            const runtime = window.aqsa7BackupProviderRuntime;
            if (!providerFactory || !providerContract || !runtime) throw new Error('Google Drive provider boundary missing.');
            const authContract = window.AQSA7_GOOGLE_DRIVE_AUTH_CONTRACT;
            const authBoundary = window.aqsa7GoogleDriveAuth;
            if (!authContract || !authBoundary || authContract.contractId !== 'aqsa7-google-drive-auth-boundary' || authContract.tokenPersistence !== 'none' || authContract.secretStorage !== false) {
              throw new Error('Google Drive auth boundary missing or unsafe.');
            }
            if (providerContract.id !== 'google-drive' || providerContract.apiVersion !== 'v3' || providerContract.storageSpace !== 'appDataFolder' || providerContract.oauthScope !== 'https://www.googleapis.com/auth/drive.appdata') {
              throw new Error('Google Drive provider contract incompatible: '+JSON.stringify(providerContract));
            }
            authBoundary.clear();
            authBoundary.configure({getAccessToken:async()=> 'smoke-token'});
            const originalFetch = window.fetch;
            const calls = [];
            let getPayload = null;
            window.fetch = async (url, init={}) => {
              calls.push({url:String(url),method:init.method||'GET'});
              if (String(url).includes('/about?')) return new Response(JSON.stringify({user:{emailAddress:'smoke@example.com'},storageQuota:{usage:'1'}}),{status:200,headers:{'Content-Type':'application/json'}});
              if (String(url).includes('/files?') && (init.method||'GET') === 'GET') return new Response(JSON.stringify({files:[{id:'drive-file-1',name:'AQSA7-backup-drive-file-1.aqsa7.json',appProperties:{aqsa7ProductId:'aqsa7',aqsa7TenantId:'tenant-1',aqsa7InstanceId:'instance-1',aqsa7BackupId:'logical-1'}}]}),{status:200,headers:{'Content-Type':'application/json'}});
              if (String(url).includes('uploadType=multipart')) return new Response(JSON.stringify({id:'drive-file-1',name:'AQSA7-backup-drive-file-1.aqsa7.json',appProperties:{aqsa7BackupId:'logical-1'}}),{status:200,headers:{'Content-Type':'application/json'}});
              if (String(url).includes('alt=media')) return new Response(JSON.stringify({artifactType:'AQSA7_BACKUP_ARTIFACT',artifactVersion:1,schemaVersion:5,crypto:{algorithm:'AES-GCM-256'},ciphertext:'opaque'}),{status:200,headers:{'Content-Type':'application/json'}});
              if ((init.method||'GET') === 'DELETE') return new Response('',{status:204});
              throw new Error('Unexpected Google Drive smoke request: '+url);
            };
            try {
              const adapter = providerFactory({auth:{getAccessToken:async()=> 'smoke-token'}});
              runtime.clear();
              runtime.register(adapter);
              const identity={productId:'aqsa7',tenantId:'tenant-1',instanceId:'instance-1'};
              const health=await runtime.health('google-drive',identity);
              const list=await window.aqsa7ExecuteBackupProvider(adapter,'list',identity);
              const artifact={artifactType:'AQSA7_BACKUP_ARTIFACT',artifactVersion:1,schemaVersion:5,crypto:{algorithm:'AES-GCM-256'},ciphertext:'opaque'};
              const put=await window.aqsa7ExecuteBackupProvider(adapter,'put',identity,{artifact});
              const get=await window.aqsa7ExecuteBackupProvider(adapter,'get',identity,{backupId:'drive-file-1'});
              const del=await window.aqsa7ExecuteBackupProvider(adapter,'delete',identity,{backupId:'drive-file-1'});
              const missingAuth = (()=>{ try { providerFactory({}); return false; } catch (_) { return true; } })();
              return {health:health.status,list:list.status,put:put.status,putId:put.backupId,get:get.status,getArtifact:get.artifact?.artifactType,del:del.status,missingAuth,calls:calls.length};
            } finally {
              window.fetch=originalFetch;
              runtime.clear();
            }
          });
          if (googleDriveProviderSmoke.health !== 'success' || googleDriveProviderSmoke.list !== 'success' || googleDriveProviderSmoke.put !== 'success' || googleDriveProviderSmoke.putId !== 'drive-file-1' || googleDriveProviderSmoke.get !== 'success' || googleDriveProviderSmoke.getArtifact !== 'AQSA7_BACKUP_ARTIFACT' || googleDriveProviderSmoke.del !== 'success' || !googleDriveProviderSmoke.missingAuth) {
            throw new Error('Google Drive provider smoke failed: '+JSON.stringify(googleDriveProviderSmoke));
          }


          const sharedCapabilities = await page.evaluate(() => ({
            ids: typeof window.aqsa7ListSharedCapabilityIds === 'function' ? window.aqsa7ListSharedCapabilityIds() : [],
            manifest: window.AQSA7_SHARED_CAPABILITY_MANIFEST || null,
            product: typeof window.aqsa7GetProductCapabilities === 'function' ? window.aqsa7GetProductCapabilities() : [],
            billing: window.aqsa7BillingContract ? {
              balance: window.aqsa7BillingContract.calculateBalance(1000, 400),
              change: window.aqsa7BillingContract.calculateChange(1000, 1200),
              summary: window.aqsa7BillingContract.summarizeReceivables([{total:'1000',paid:'400',balance:'600'}])
            } : null
          }));
          if (!sharedCapabilities.manifest || sharedCapabilities.manifest.layer !== 'shared-business-capabilities') throw new Error('Shared capability registry missing');
          if (!sharedCapabilities.ids.includes('people') || !sharedCapabilities.ids.includes('catalog') || !sharedCapabilities.ids.includes('billing') || !sharedCapabilities.ids.includes('receipts')) throw new Error('Required generic shared capabilities missing');
          if (sharedCapabilities.product.length !== 5 || !sharedCapabilities.product.every(cap => sharedCapabilities.ids.includes(cap.id))) throw new Error('Dental product capability selection is not registry-backed');
          if (sharedCapabilities.product.some(cap => cap.id === 'dental' || cap.id === 'odontogram' || cap.id === 'clinical')) throw new Error('Dental-specific domain leaked into shared capability registry');
          if (sharedCapabilities.billing?.balance !== 600 || sharedCapabilities.billing?.change !== 200 || sharedCapabilities.billing?.summary?.balance !== 600) throw new Error('Shared billing capability contract failed');

          const shell = await page.evaluate(() => ({
            brand: document.querySelector('.brand-platform')?.textContent?.trim(),
            clinic: document.querySelector('.brand-title')?.textContent?.trim(),
            navCount: document.querySelectorAll('.app-tabs .app-tab').length,
            activeCount: document.querySelectorAll('.app-tabs .app-tab.active').length,
            currentCount: document.querySelectorAll('.app-tabs .app-tab[aria-current="page"]').length
          }));
          if (shell.brand !== 'AQSA7') throw new Error('AQSA7 product identity missing');
          if (!shell.clinic) throw new Error('Clinic identity missing from app shell');
          if (shell.navCount !== 4) throw new Error('Unexpected navigation item count: '+shell.navCount);
          if (shell.activeCount !== 1 || shell.currentCount !== 1) throw new Error('Navigation active-state contract failed');

          for (const id of ['receiptPrintArea','digDate','tabPatients','tabHistory','tabSettings']) {
            if (!(await page.locator('#' + id).count())) throw new Error('Missing #' + id);
          }

          const fns = await page.evaluate(() => ({
            activateAppTab: typeof window.activateAppTab,
            setMode: typeof window.setMode,
            triggerNativePrint: typeof window.triggerNativePrint,
            openPreviewModal: typeof window.openPreviewModal,
            downloadReceiptImage: typeof window.downloadReceiptImage
          }));
          for (const [name,type] of Object.entries(fns)) {
            if (type !== 'function') throw new Error('Missing runtime function: ' + name);
          }

          await page.locator('#digDate').fill('07/10/2026');
          await page.locator('#digDate').dispatchEvent('input');
          const printDate = await page.locator('#printDateValue').innerText();
          if (!printDate.includes('07/10/2026')) throw new Error('Date rendering failed: ' + printDate);

          await page.locator('#tabPatients').click();
          if (!(await page.locator('#patientsModal').evaluate(e => e.classList.contains('open')))) throw new Error('Patients panel did not open');
          if (!page.url().endsWith('#patients')) throw new Error('Patients route state missing');

          if (typeof await page.evaluate(() => typeof window.renderPatients) !== 'string' || await page.evaluate(() => typeof window.renderPatients !== 'function')) throw new Error('renderPatients runtime function missing');
          await page.evaluate(() => window.renderPatients());
          await page.locator('.patient-ledger-head').waitFor({state:'attached', timeout:5000});
          const patientDirectory = await page.evaluate(() => ({
            search: !!document.querySelector('#patientDirectorySearch'),
            filter: !!document.querySelector('#patientDirectoryFilter'),
            table: !!document.querySelector('#patientsList.patient-ledger-table'),
            header: !!document.querySelector('.patient-ledger-head')
          }));
          if (!patientDirectory.search || !patientDirectory.filter || !patientDirectory.table || !patientDirectory.header) {
            throw new Error('Patient directory ledger contract failed');
          }

          await page.goBack();
          if (await page.locator('#patientsModal').evaluate(e => e.classList.contains('open'))) throw new Error('Patients panel did not close on Back');

          await page.locator('#tabReceipt').click();
          const issuance = await page.evaluate(() => ({
            panel: !!document.querySelector('#receiptIssuancePanel'),
            context: !!document.querySelector('#issuancePatientName'),
            finance: document.querySelectorAll('.receipt-issuance-finance > div').length,
            actions: document.querySelectorAll('.receipt-issuance-actions .issuance-action').length,
            calculator: typeof window.calculateLedger === 'function'
          }));
          if (!issuance.panel || !issuance.context || issuance.finance !== 4 || issuance.actions !== 4 || !issuance.calculator) throw new Error('Receipt issuance panel contract failed');
          await page.locator('#digClientName').fill('اختبار إصدار السند');
          await page.locator('#digTotal').fill('1000');
          await page.locator('#digPaid').fill('400');
          await page.locator('#digPatientPhone').fill('777000002');
          await page.evaluate(() => toggleService(document.querySelector('.custom-check-item')));
          const issuanceValues = await page.evaluate(() => ({
            patient: document.querySelector('#issuancePatientName')?.textContent,
            total: document.querySelector('#issuanceTotal')?.textContent,
            paid: document.querySelector('#issuancePaid')?.textContent,
            balance: document.querySelector('#issuanceBalance')?.textContent,
            serviceCount: document.querySelector('#issuanceServiceCount')?.textContent,
            method: document.querySelector('#issuancePayMethod')?.textContent
          }));
          if (issuanceValues.patient !== 'اختبار إصدار السند' || issuanceValues.total !== '1,000' || issuanceValues.paid !== '400' || issuanceValues.balance !== '600' || issuanceValues.serviceCount !== '1' || issuanceValues.method !== 'نقداً') throw new Error('Receipt issuance live summary failed: '+JSON.stringify(issuanceValues));


          await page.locator('#tabHistory').click();
          if (!(await page.locator('#historyModal').evaluate(e => e.classList.contains('open')))) throw new Error('History panel did not open');
          const historyLedger = await page.evaluate(() => ({
            table: !!document.querySelector('#historyList.history-ledger-table'),
            header: !!document.querySelector('.history-ledger-head-row'),
            search: !!document.querySelector('#historySearch'),
            filter: !!document.querySelector('#historyFilter'),
            stats: document.querySelectorAll('#historyStats .stat-cell').length,
            rows: document.querySelectorAll('#historyList .history-ledger-row').length
          }));
          if (!historyLedger.table || !historyLedger.header || !historyLedger.search || !historyLedger.filter || historyLedger.stats !== 4) throw new Error('History receipts ledger contract failed: '+JSON.stringify(historyLedger));
          await page.locator('#historySearch').fill('اختبار إصدار السند');
          if ((await page.locator('#historyList .history-ledger-row').count()) !== 0) throw new Error('History search unexpectedly matched unsaved smoke receipt');
          await page.locator('#historySearch').fill('');
          await page.locator('#historyFilter').selectOption('settled');
          if ((await page.locator('#historyFilter').inputValue()) !== 'settled') throw new Error('History filter interaction failed');
          await page.locator('#historyModal .modal-close').click();
          if (await page.locator('#historyModal').evaluate(e => e.classList.contains('open'))) throw new Error('History panel did not close');

          await page.locator('#tabSettings').click();

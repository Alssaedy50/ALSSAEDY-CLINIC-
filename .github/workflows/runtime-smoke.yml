name: AQSA7 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax validation
        run: |
          for file in js/*.js; do node --check "$file"; done

      - name: Verify AI vendor isolation in business/platform modules
        run: |
          if grep -Eri -- '@(openai|anthropic|google-generative-ai|google/genai|mistralai|cohere|groq)|from[[:space:]]+["'"'](openai|anthropic|@google|mistralai|cohere|groq)|require\(["'"'](openai|anthropic|@google|mistralai|cohere|groq)' js/product.js js/capabilities.js js/repository.js js/storage.js js/app.js; then
            echo 'Direct AI vendor/SDK reference leaked into core or business modules.'
            exit 1
          fi

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aqsa7-http.log 2>&1 &
          echo $! >/tmp/aqsa7-http.pid
          sleep 2

      - name: Run mobile browser smoke
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

          const title = await page.title();
          if (!title.includes('سند قبض مالي')) throw new Error('Unexpected page title');

          const designTokens = await page.evaluate(() => {
            const root = getComputedStyle(document.documentElement);
            const token = name => root.getPropertyValue(name).trim();
            const tab = document.querySelector('#tabReceipt');
            return {
              primary: token('--color-primary'),
              paid: token('--color-paid'),
              warning: token('--color-warning'),
              surface: token('--color-surface'),
              white: token('--color-white'),
              border: token('--color-border'),
              fontUi: token('--font-ui'),
              touchTarget: token('--touch-target'),
              tabHeight: tab ? Math.round(tab.getBoundingClientRect().height) : 0
            };
          });
          const expectedTokens = {
            primary: '#1E3A8A',
            paid: '#059669',
            warning: '#D97706',
            surface: '#F8FAFC',
            white: '#FFFFFF',
            border: '#E2E8F0',
            touchTarget: '44px'
          };
          for (const [key, expected] of Object.entries(expectedTokens)) {
            const actual = designTokens[key].toUpperCase();
            if (actual !== expected.toUpperCase()) throw new Error('Design token mismatch '+key+': '+designTokens[key]);
          }
          if (!designTokens.fontUi.includes('system-ui')) throw new Error('UI font token is not system-ui based');
          if (designTokens.tabHeight < 44) throw new Error('Receipt tab touch target is below 44px: '+designTokens.tabHeight);

          const productBoundary = await page.evaluate(() => ({
            manifest: window.AQSA7_PRODUCT_MANIFEST,
            clinic: window.AQSA7_CLINIC_CONFIG,
            stamped: typeof window.aqsa7StampRecord === 'function' ? window.aqsa7StampRecord({id:'smoke-record'}) : null
          }));
          if (!productBoundary.manifest || productBoundary.manifest.productId !== 'dental-clinic') throw new Error('Product manifest boundary missing');
          if (!productBoundary.manifest.capabilities.includes('patients') || !productBoundary.manifest.capabilities.includes('receipts')) throw new Error('Dental product capability manifest incomplete');
          if (!productBoundary.manifest.optionalCapabilities.includes('ai')) throw new Error('AI capability boundary missing');
          if (!productBoundary.clinic || productBoundary.clinic.productId !== 'dental-clinic' || !productBoundary.clinic.tenantId || !productBoundary.clinic.instanceId) throw new Error('Clinic instance configuration boundary missing');
          if (productBoundary.stamped.productId !== 'dental-clinic' || productBoundary.stamped.tenantId !== productBoundary.clinic.tenantId || productBoundary.stamped.instanceId !== productBoundary.clinic.instanceId) throw new Error('Repository record identity stamping failed');
          const productContract = await page.evaluate(() => ({
            validation: typeof window.aqsa7ValidateProductDefinition === 'function' ? window.aqsa7ValidateProductDefinition() : null,
            modules: window.AQSA7_PRODUCT_MANIFEST?.modules || [],
            enabledModules: window.AQSA7_CLINIC_CONFIG?.enabledModules || [],
            defaultReceiptSize: window.AQSA7_CLINIC_CONFIG?.documentTemplates?.receipt?.defaultSize,
            allowedReceiptSizes: window.AQSA7_CLINIC_CONFIG?.documentTemplates?.receipt?.allowedSizes || [],
            databaseName: window.aqsa7GetInstanceStorageConfig?.()?.databaseName || ''
          }));
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed: '+JSON.stringify(productContract.validation));
          if (!productContract.modules.includes('billing') || !productContract.modules.includes('receipts')) throw new Error('Shared module contract incomplete');
          if (!productContract.enabledModules.every(id => productContract.modules.includes(id))) throw new Error('Instance enables a module outside the product definition');
          if (!productContract.allowedReceiptSizes.includes(productContract.defaultReceiptSize)) throw new Error('Instance receipt default is outside the product template contract');
          if (!productContract.databaseName) throw new Error('Instance storage contract missing database name');

          const aiContract = await page.evaluate(() => ({
            manifest: window.AQSA7_AI_MANIFEST || null,
            ids: window.AQSA7_AI_MANIFEST ? Object.keys(window.AQSA7_AI_MANIFEST.capabilities) : [],
            frozenManifest: Object.isFrozen(window.AQSA7_AI_MANIFEST),
            frozenCapability: Object.isFrozen(window.AQSA7_AI_MANIFEST?.capabilities?.summarize),
            prompt: window.aqsa7GetAIPromptTemplate?.('summarize') || null,
            descriptor: (() => {
              try { return window.aqsa7CreateAIProviderDescriptor(window.aqsa7GetDefaultAIAdapter()); } catch (e) { return {error:String(e)}; }
            })(),
            disabledError: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', policy:{enabled:false}}); return null; } catch (e) { return String(e); }
            })(),
            externalDenied: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', external:true, policy:{enabled:true,allowExternalTransmission:false}}); return null; } catch (e) { return String(e); }
            })(),
            sensitiveDenied: (() => {
              try { window.aqsa7ValidateAIRequest({capabilityId:'summarize', input:'x', sensitive:true, policy:{enabled:true,allowSensitiveData:false}}); return null; } catch (e) { return String(e); }
            })()
          }));
          if (!aiContract.manifest || aiContract.manifest.layer !== 'platform-ai' || aiContract.manifest.providerIndependent !== true || aiContract.manifest.coreDependency !== false) throw new Error('AI platform contract missing/provider-coupled');
          if (aiContract.manifest.secrets !== 'none' || aiContract.manifest.persistence !== 'none') throw new Error('AI contract introduced secrets or persistence ownership');
          for (const id of ['summarize','extract','classify','search','generate','recommend']) if (!aiContract.ids.includes(id)) throw new Error('Missing AI capability: '+id);
          if (!aiContract.frozenManifest || !aiContract.frozenCapability) throw new Error('AI contract is mutable');
          if (!aiContract.prompt?.template || aiContract.prompt.version !== 1) throw new Error('AI prompt template contract missing');
          if (aiContract.descriptor?.id !== 'unconfigured' || !Array.isArray(aiContract.descriptor?.capabilities)) throw new Error('Default AI adapter must fail-soft as unconfigured');
          if (aiContract.disabledError !== 'Error: AQSA7_AI_DISABLED') throw new Error('AI disabled policy is not fail-closed');
          if (aiContract.externalDenied !== 'Error: AQSA7_AI_EXTERNAL_TRANSMISSION_DENIED') throw new Error('External AI transmission policy is not fail-closed');
          if (aiContract.sensitiveDenied !== 'Error: AQSA7_AI_SENSITIVE_DATA_DENIED') throw new Error('Sensitive-data AI policy is not fail-closed');
          if (!productContract.validation?.valid) throw new Error('Product definition validation failed after AI contract integration: '+JSON.stringify(productContract.validation));
          const isolation = await page.evaluate(async () => {
            const identity = typeof window.aqsa7GetInstanceIdentity === 'function' ? window.aqsa7GetInstanceIdentity() : null;
            const owned = typeof window.aqsa7OwnRecord === 'function' ? window.aqsa7OwnRecord({id:'isolation-smoke'}) : null;
            let recordMismatchRejected = false;
            let partialIdentityRejected = false;
            let backupMismatchRejected = false;
            try { window.aqsa7OwnRecord({...owned, tenantId:'foreign-tenant'}); } catch (_) { recordMismatchRejected = true; }
            try { window.aqsa7OwnRecord({id:'partial', tenantId:identity?.tenantId}); } catch (_) { partialIdentityRejected = true; }
            try { window.aqsa7ValidateBackupScope({...identity, tenantId:'foreign-tenant'}); } catch (_) { backupMismatchRejected = true; }
            const backup = typeof window.buildFullBackup === 'function' ? await window.buildFullBackup() : null;
            return {
              identity, owned, recordMismatchRejected, partialIdentityRejected, backupMismatchRejected,
              backupOwnership: backup?.ownership || null,
              backupSchemaVersion: backup?.schemaVersion || null,
              backupRecordIdentities: [...(backup?.receipts || []), ...(backup?.patients || [])].map(r => ({productId:r.productId, tenantId:r.tenantId, instanceId:r.instanceId}))
            };
          });
          if (!isolation.identity?.productId || !isolation.identity?.tenantId || !isolation.identity?.instanceId) throw new Error('Instance identity contract missing');
          if (isolation.owned.productId !== isolation.identity.productId || isolation.owned.tenantId !== isolation.identity.tenantId || isolation.owned.instanceId !== isolation.identity.instanceId) throw new Error('Unscoped record was not adopted into current instance scope');
          if (!isolation.recordMismatchRejected || !isolation.partialIdentityRejected || !isolation.backupMismatchRejected) throw new Error('Tenant/instance isolation fail-closed checks failed: '+JSON.stringify(isolation));
          if (isolation.backupOwnership?.scope !== 'instance' || isolation.backupOwnership.tenantId !== isolation.identity.tenantId || isolation.backupOwnership.instanceId !== isolation.identity.instanceId) throw new Error('Backup ownership scope missing');
          if (isolation.backupSchemaVersion !== 5) throw new Error('Backup schema was not upgraded for isolation contract');
          if (isolation.backupRecordIdentities.some(r => r.productId !== isolation.identity.productId || r.tenantId !== isolation.identity.tenantId || r.instanceId !== isolation.identity.instanceId)) throw new Error('Backup contains a record outside current instance scope');

          const sharedCapabilities = await page.evaluate(() => ({
            ids: typeof window.aqsa7ListSharedCapabilityIds === 'function' ? window.aqsa7ListSharedCapabilityIds() : [],
            manifest: window.AQSA7_SHARED_CAPABILITY_MANIFEST || null,
            product: typeof window.aqsa7GetProductCapabilities === 'function' ? window.aqsa7GetProductCapabilities() : [],
            billing: window.aqsa7BillingContract ? {
              balance: window.aqsa7BillingContract.calculateBalance(1000, 400),
              change: window.aqsa7BillingContract.calculateChange(1000, 1200),
              summary: window.aqsa7BillingContract.summarizeReceivables([{total:'1000',paid:'400',balance:'600'}])
            } : null
          }));
          if (!sharedCapabilities.manifest || sharedCapabilities.manifest.layer !== 'shared-business-capabilities') throw new Error('Shared capability registry missing');
          if (!sharedCapabilities.ids.includes('people') || !sharedCapabilities.ids.includes('catalog') || !sharedCapabilities.ids.includes('billing') || !sharedCapabilities.ids.includes('receipts')) throw new Error('Required generic shared capabilities missing');
          if (sharedCapabilities.product.length !== 5 || !sharedCapabilities.product.every(cap => sharedCapabilities.ids.includes(cap.id))) throw new Error('Dental product capability selection is not registry-backed');
          if (sharedCapabilities.product.some(cap => cap.id === 'dental' || cap.id === 'odontogram' || cap.id === 'clinical')) throw new Error('Dental-specific domain leaked into shared capability registry');
          if (sharedCapabilities.billing?.balance !== 600 || sharedCapabilities.billing?.change !== 200 || sharedCapabilities.billing?.summary?.balance !== 600) throw new Error('Shared billing capability contract failed');

          const shell = await page.evaluate(() => ({
            brand: document.querySelector('.brand-platform')?.textContent?.trim(),
            clinic: document.querySelector('.brand-title')?.textContent?.trim(),
            navCount: document.querySelectorAll('.app-tabs .app-tab').length,
            activeCount: document.querySelectorAll('.app-tabs .app-tab.active').length,
            currentCount: document.querySelectorAll('.app-tabs .app-tab[aria-current="page"]').length
          }));
          if (shell.brand !== 'AQSA7') throw new Error('AQSA7 product identity missing');
          if (!shell.clinic) throw new Error('Clinic identity missing from app shell');
          if (shell.navCount !== 4) throw new Error('Unexpected navigation item count: '+shell.navCount);
          if (shell.activeCount !== 1 || shell.currentCount !== 1) throw new Error('Navigation active-state contract failed');

          for (const id of ['receiptPrintArea','digDate','tabPatients','tabHistory','tabSettings']) {
            if (!(await page.locator('#' + id).count())) throw new Error('Missing #' + id);
          }

          const fns = await page.evaluate(() => ({
            activateAppTab: typeof window.activateAppTab,
            setMode: typeof window.setMode,
            triggerNativePrint: typeof window.triggerNativePrint,
            openPreviewModal: typeof window.openPreviewModal,
            downloadReceiptImage: typeof window.downloadReceiptImage
          }));
          for (const [name,type] of Object.entries(fns)) {
            if (type !== 'function') throw new Error('Missing runtime function: ' + name);
          }

          await page.locator('#digDate').fill('07/10/2026');
          await page.locator('#digDate').dispatchEvent('input');
          const printDate = await page.locator('#printDateValue').innerText();
          if (!printDate.includes('07/10/2026')) throw new Error('Date rendering failed: ' + printDate);

          await page.locator('#tabPatients').click();
          if (!(await page.locator('#patientsModal').evaluate(e => e.classList.contains('open')))) throw new Error('Patients panel did not open');
          if (!page.url().endsWith('#patients')) throw new Error('Patients route state missing');

          if (typeof await page.evaluate(() => typeof window.renderPatients) !== 'string' || await page.evaluate(() => typeof window.renderPatients !== 'function')) throw new Error('renderPatients runtime function missing');
          await page.evaluate(() => window.renderPatients());
          await page.locator('.patient-ledger-head').waitFor({state:'attached', timeout:5000});
          const patientDirectory = await page.evaluate(() => ({
            search: !!document.querySelector('#patientDirectorySearch'),
            filter: !!document.querySelector('#patientDirectoryFilter'),
            table: !!document.querySelector('#patientsList.patient-ledger-table'),
            header: !!document.querySelector('.patient-ledger-head')
          }));
          if (!patientDirectory.search || !patientDirectory.filter || !patientDirectory.table || !patientDirectory.header) {
            throw new Error('Patient directory ledger contract failed');
          }

          await page.goBack();
          if (await page.locator('#patientsModal').evaluate(e => e.classList.contains('open'))) throw new Error('Patients panel did not close on Back');

          await page.locator('#tabReceipt').click();
          const issuance = await page.evaluate(() => ({
            panel: !!document.querySelector('#receiptIssuancePanel'),
            context: !!document.querySelector('#issuancePatientName'),
            finance: document.querySelectorAll('.receipt-issuance-finance > div').length,
            actions: document.querySelectorAll('.receipt-issuance-actions .issuance-action').length,
            calculator: typeof window.calculateLedger === 'function'
          }));
          if (!issuance.panel || !issuance.context || issuance.finance !== 4 || issuance.actions !== 4 || !issuance.calculator) throw new Error('Receipt issuance panel contract failed');
          await page.locator('#digClientName').fill('اختبار إصدار السند');
          await page.locator('#digTotal').fill('1000');
          await page.locator('#digPaid').fill('400');
          await page.locator('#digPatientPhone').fill('777000002');
          await page.evaluate(() => toggleService(document.querySelector('.custom-check-item')));
          const issuanceValues = await page.evaluate(() => ({
            patient: document.querySelector('#issuancePatientName')?.textContent,
            total: document.querySelector('#issuanceTotal')?.textContent,
            paid: document.querySelector('#issuancePaid')?.textContent,
            balance: document.querySelector('#issuanceBalance')?.textContent,
            serviceCount: document.querySelector('#issuanceServiceCount')?.textContent,
            method: document.querySelector('#issuancePayMethod')?.textContent
          }));
          if (issuanceValues.patient !== 'اختبار إصدار السند' || issuanceValues.total !== '1,000' || issuanceValues.paid !== '400' || issuanceValues.balance !== '600' || issuanceValues.serviceCount !== '1' || issuanceValues.method !== 'نقداً') throw new Error('Receipt issuance live summary failed: '+JSON.stringify(issuanceValues));


          await page.locator('#tabHistory').click();
          if (!(await page.locator('#historyModal').evaluate(e => e.classList.contains('open')))) throw new Error('History panel did not open');
          const historyLedger = await page.evaluate(() => ({
            table: !!document.querySelector('#historyList.history-ledger-table'),
            header: !!document.querySelector('.history-ledger-head-row'),
            search: !!document.querySelector('#historySearch'),
            filter: !!document.querySelector('#historyFilter'),
            stats: document.querySelectorAll('#historyStats .stat-cell').length,
            rows: document.querySelectorAll('#historyList .history-ledger-row').length
          }));
          if (!historyLedger.table || !historyLedger.header || !historyLedger.search || !historyLedger.filter || historyLedger.stats !== 4) throw new Error('History receipts ledger contract failed: '+JSON.stringify(historyLedger));
          await page.locator('#historySearch').fill('اختبار إصدار السند');
          if ((await page.locator('#historyList .history-ledger-row').count()) !== 0) throw new Error('History search unexpectedly matched unsaved smoke receipt');
          await page.locator('#historySearch').fill('');
          await page.locator('#historyFilter').selectOption('settled');
          if ((await page.locator('#historyFilter').inputValue()) !== 'settled') throw new Error('History filter interaction failed');
          await page.locator('#historyModal .modal-close').click();
          if (await page.locator('#historyModal').evaluate(e => e.classList.contains('open'))) throw new Error('History panel did not close');

          await page.locator('#tabSettings').click();
          if (!(await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open')))) throw new Error('Settings panel did not open');
          const settingsSurface = await page.evaluate(() => ({
            overview: !!document.querySelector('.settings-overview'),
            chips: document.querySelectorAll('.settings-overview-chips span').length,
            cards: document.querySelectorAll('#settingsPanel .setting-card').length,
            touch: [...document.querySelectorAll('#settingsPanel button, #settingsPanel select')].filter(e => Math.round(e.getBoundingClientRect().height) < 44).length
          }));
          if (!settingsSurface.overview || settingsSurface.chips !== 6 || settingsSurface.cards < 6 || settingsSurface.touch) throw new Error('Settings dashboard contract failed: '+JSON.stringify(settingsSurface));
          await page.locator('#settingsPanel .btn-close').click();
          if (await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open'))) throw new Error('Settings panel did not close');

          await page.locator('#tabReceipt').click();
          if (await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open'))) throw new Error('Settings panel did not close');

          await page.screenshot({path:'aqsa7-runtime-receipt.png',fullPage:true});

          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Run desktop browser integration smoke
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

          const layout = await page.evaluate(() => {
            const width = el => el ? Math.round(el.getBoundingClientRect().width) : 0;
            const receipt = document.querySelector('#receiptPrintArea');
            const issuance = document.querySelector('#receiptIssuancePanel');
            return {
              shell: width(document.querySelector('.site-navbar')),
              nav: width(document.querySelector('.app-tabs')),
              receipt: width(receipt),
              issuance: width(issuance),
              receiptOverflow: receipt ? Math.max(0, receipt.scrollWidth - receipt.clientWidth) : 0,
              issuanceOverflow: issuance ? Math.max(0, issuance.scrollWidth - issuance.clientWidth) : 0
            };
          });
          if (layout.shell !== 1440) throw new Error('Desktop shell does not span viewport: '+JSON.stringify(layout));
          if (layout.nav <= 0 || layout.receipt <= 0 || layout.issuance <= 0) throw new Error('Desktop core surface missing: '+JSON.stringify(layout));
          if (layout.receiptOverflow > 2 || layout.issuanceOverflow > 2) throw new Error('Desktop horizontal overflow detected: '+JSON.stringify(layout));

          await page.locator('#tabPatients').click();
          if (!(await page.locator('#patientsModal').evaluate(e => e.classList.contains('open')))) throw new Error('Desktop patients surface did not open');
          if ((await page.locator('#patientsModal').evaluate(e => Math.round(e.getBoundingClientRect().width))) < 600) throw new Error('Desktop patients surface is unexpectedly narrow');
          await page.locator('#patientsModal .modal-close').click();
          if (await page.locator('#patientsModal').evaluate(e => e.classList.contains('open'))) throw new Error('Desktop patients surface did not close');

          await page.locator('#tabHistory').click();
          if (!(await page.locator('#historyModal').evaluate(e => e.classList.contains('open')))) throw new Error('Desktop history surface did not open');
          if ((await page.locator('#historyModal').evaluate(e => Math.round(e.getBoundingClientRect().width))) < 380) throw new Error('Desktop history surface is unexpectedly narrow');
          await page.locator('#historyModal .modal-close').click();
          if (await page.locator('#historyModal').evaluate(e => e.classList.contains('open'))) throw new Error('Desktop history surface did not close');

          await page.locator('#tabSettings').click();
          if (!(await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open')))) throw new Error('Desktop settings surface did not open');
          if ((await page.locator('#settingsPanel').evaluate(e => Math.round(e.getBoundingClientRect().width))) < 260) throw new Error('Desktop settings surface is unexpectedly narrow');

          await page.locator('#settingsPanel .btn-close').click();
          await page.locator('#tabReceipt').click();

          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqsa7-runtime-smoke
          path: aqsa7-runtime-receipt.png
          if-no-files-found: ignore

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/aqsa7-http.pid ]; then kill $(cat /tmp/aqsa7-http.pid) || true; fi

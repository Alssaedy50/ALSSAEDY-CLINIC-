name: AQSA7 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: JavaScript syntax validation
        run: |
          for file in js/*.js; do node --check "$file"; done

      - name: Verify AI vendor isolation in business/platform modules
        run: |
          if grep -Eri -- 'openai|anthropic|google-generative-ai|google/genai|mistralai|cohere|groq' js/product.js js/capabilities.js js/repository.js js/storage.js js/app.js; then
            echo 'Direct AI vendor/SDK reference leaked into core or business modules.'
            exit 1
          fi

      - name: Verify Android and service-worker security boundaries
        run: |
          grep -q 'android:allowBackup="false"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'android:fullBackupContent="@xml/backup_rules"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'setAllowFileAccessFromFileURLs(false)' android-app/app/src/main/java/com/alssaedy/clinic/MainActivity.java
          grep -q 'setAllowUniversalAccessFromFileURLs(false)' android-app/app/src/main/java/com/alssaedy/clinic/MainActivity.java
          grep -q "const CACHE_NAME = 'alssaedy-clinic-v1.2.7-core'" sw.js
          grep -q './js/google-drive-provider.js?v=1.0.0' sw.js
          grep -q './js/cloud-recovery.js?v=1.0.0' sw.js

      - name: Start static server
        run: |
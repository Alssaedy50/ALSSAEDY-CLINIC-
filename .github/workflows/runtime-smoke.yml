                  surfaceWidth:rect ? Math.round(rect.width) : 0,
                  surfaceHeight:rect ? Math.round(rect.height) : 0,
                  dock:{left:dockRect?Math.round(dockRect.left):null,right:dockRect?Math.round(dockRect.right):null,buttonCount:dockButtons.length,visibleButtons:dockVisibleButtons},
                  heading:(el?.innerText||'').trim().slice(0,120).replace(/\\s+/g,' '),
                  primaryActions:el ? [...el.querySelectorAll('button,a,[role="button"]')].filter(x=>{const r=x.getBoundingClientRect();const s=getComputedStyle(x);return r.width>0&&r.height>0&&!x.hidden&&s.display!=='none'}).length : 0
                };
              },{id:surface.id,width:viewport.width});
              if (!state.visible) throw new Error('Phase 8.10 surface not visibly rendered: '+JSON.stringify(state));
              if (state.viewportWidth !== viewport.width) throw new Error('Phase 8.10 viewport mismatch: '+JSON.stringify(state));
              if (state.documentOverflow > 2) throw new Error('Phase 8.10 horizontal page overflow: '+JSON.stringify(state));
              const productSurface = !['platform-home','products-projects'].includes(surface.id);
              if (productSurface && state.dock.buttonCount !== 0) throw new Error('Removed floating action dock must not be present: '+JSON.stringify(state.dock));
              if (!productSurface && state.dock.visibleButtons !== 0) throw new Error('Phase 8.10 product action dock leaked into the platform-only surface: '+JSON.stringify(state.dock));
              const file = 'artifacts/phase-8-10/'+viewport.name+'/'+surface.id+'.png';
              await page.screenshot({path:file,fullPage:false,animations:'disabled'});
              report.push({...state,viewport:viewport.name,screenshot:file});
              if (surface.id==='patient-workspace') await page.locator('#patientsModal .patient-workspace-close').click();
              if (surface.id==='history-financial-ledger') {
                await page.locator('#historyModal .modal-close').click();
                // History navigation may change the visual context; restore the configured
                // Dental product exactly as the existing desktop regression does.
                await page.evaluate(() => { if (typeof setPlatformVisual === 'function') setPlatformVisual('dental'); });
              }
              if (surface.id==='settings') await page.locator('#settingsPanel .btn-close').click();
            }
            if (errors.length) throw new Error('Phase 8.10 '+viewport.name+' browser errors: '+errors.join(' | '));
            await context.close();
          }
          await browser.close();
          await writeFile('artifacts/phase-8-10/rendered-ux-report.json',JSON.stringify({
            phase:'8.10',viewports:[{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}],
            screenshotCount:report.length,results:report
          },null,2));
          if (report.length !== 16) throw new Error('Expected 16 rendered UX screenshots, got '+report.length);
          console.log('PHASE_8_10_RENDERED_UX_EVIDENCE=PASS screenshots='+report.length);
          NODE

      - name: Upload Phase 8.10 rendered UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqsa7-phase-8-10-rendered-ux
          path: artifacts/phase-8-10/
          if-no-files-found: error

      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqsa7-runtime-smoke
          path: aqsa7-runtime-receipt.png
          if-no-files-found: ignore

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/aqsa7-http.pid ]; then kill $(cat /tmp/aqsa7-http.pid) || true; fi

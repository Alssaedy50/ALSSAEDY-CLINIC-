name: AQSA7 Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright runner
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aqsa7-http.log 2>&1 &
          echo $! >/tmp/aqsa7-http.pid
          sleep 2

      - name: Run mobile browser smoke
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});

          const title = await page.title();
          if (!title.includes('سند قبض مالي')) throw new Error('Unexpected page title');

          const designTokens = await page.evaluate(() => {
            const root = getComputedStyle(document.documentElement);
            const token = name => root.getPropertyValue(name).trim();
            const tab = document.querySelector('#tabReceipt');
            return {
              primary: token('--color-primary'),
              paid: token('--color-paid'),
              warning: token('--color-warning'),
              surface: token('--color-surface'),
              white: token('--color-white'),
              border: token('--color-border'),
              fontUi: token('--font-ui'),
              touchTarget: token('--touch-target'),
              tabHeight: tab ? Math.round(tab.getBoundingClientRect().height) : 0
            };
          });
          const expectedTokens = {
            primary: '#1E3A8A',
            paid: '#059669',
            warning: '#D97706',
            surface: '#F8FAFC',
            white: '#FFFFFF',
            border: '#E2E8F0',
            touchTarget: '44px'
          };
          for (const [key, expected] of Object.entries(expectedTokens)) {
            const actual = designTokens[key].toUpperCase();
            if (actual !== expected.toUpperCase()) throw new Error('Design token mismatch '+key+': '+designTokens[key]);
          }
          if (!designTokens.fontUi.includes('system-ui')) throw new Error('UI font token is not system-ui based');
          if (designTokens.tabHeight < 44) throw new Error('Receipt tab touch target is below 44px: '+designTokens.tabHeight);

          const shell = await page.evaluate(() => ({
            brand: document.querySelector('.brand-platform')?.textContent?.trim(),
            clinic: document.querySelector('.brand-title')?.textContent?.trim(),
            navCount: document.querySelectorAll('.app-tabs .app-tab').length,
            activeCount: document.querySelectorAll('.app-tabs .app-tab.active').length,
            currentCount: document.querySelectorAll('.app-tabs .app-tab[aria-current="page"]').length
          }));
          if (shell.brand !== 'AQSA7') throw new Error('AQSA7 product identity missing');
          if (!shell.clinic) throw new Error('Clinic identity missing from app shell');
          if (shell.navCount !== 4) throw new Error('Unexpected navigation item count: '+shell.navCount);
          if (shell.activeCount !== 1 || shell.currentCount !== 1) throw new Error('Navigation active-state contract failed');

          for (const id of ['receiptPrintArea','digDate','tabPatients','tabHistory','tabSettings']) {
            if (!(await page.locator('#' + id).count())) throw new Error('Missing #' + id);
          }

          const fns = await page.evaluate(() => ({
            activateAppTab: typeof window.activateAppTab,
            setMode: typeof window.setMode,
            triggerNativePrint: typeof window.triggerNativePrint,
            openPreviewModal: typeof window.openPreviewModal,
            downloadReceiptImage: typeof window.downloadReceiptImage
          }));
          for (const [name,type] of Object.entries(fns)) {
            if (type !== 'function') throw new Error('Missing runtime function: ' + name);
          }

          await page.locator('#digDate').fill('07/10/2026');
          await page.locator('#digDate').dispatchEvent('input');
          const printDate = await page.locator('#printDateValue').innerText();
          if (!printDate.includes('07/10/2026')) throw new Error('Date rendering failed: ' + printDate);

          await page.locator('#tabPatients').click();
          if (!(await page.locator('#patientsModal').evaluate(e => e.classList.contains('open')))) throw new Error('Patients panel did not open');
          if (!page.url().endsWith('#patients')) throw new Error('Patients route state missing');

          await page.goBack();
          if (await page.locator('#patientsModal').evaluate(e => e.classList.contains('open'))) throw new Error('Patients panel did not close on Back');

          await page.locator('#tabHistory').click();
          if (!(await page.locator('#historyModal').evaluate(e => e.classList.contains('open')))) throw new Error('History panel did not open');
          await page.locator('#historyModal .modal-close').click();
          if (await page.locator('#historyModal').evaluate(e => e.classList.contains('open'))) throw new Error('History panel did not close');

          await page.locator('#tabSettings').click();
          if (!(await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open')))) throw new Error('Settings panel did not open');
          await page.locator('#settingsPanel .btn-close').click();
          if (await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open'))) throw new Error('Settings panel did not close');

          await page.locator('#tabReceipt').click();
          if (await page.locator('#settingsPanel').evaluate(e => e.classList.contains('open'))) throw new Error('Settings panel did not close');

          await page.screenshot({path:'aqsa7-runtime-receipt.png',fullPage:true});

          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqsa7-runtime-smoke
          path: aqsa7-runtime-receipt.png
          if-no-files-found: ignore

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/aqsa7-http.pid ]; then kill $(cat /tmp/aqsa7-http.pid) || true; fi
